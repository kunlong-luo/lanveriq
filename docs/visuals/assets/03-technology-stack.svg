soft YaHei',sans-serif">shadcn/ui + Lucide + Motion</text><text x="1130" y="597" fill="#60738E" font-size="16" font-weight="500" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">组件、图标、动画</text><rect x="1111" y="629" width="409" height="76" rx="14" fill="#ECF3FC" stroke="none" stroke-width="1"/><text x="1130" y="661" fill="#7C3AED" font-size="21" font-weight="740" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">TanStack Query / Table</text><text x="1130" y="688" fill="#60738E" font-size="16" font-weight="500" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">服务端状态与表格</text><path d="M512 504 H562" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1074 504 H1024" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="54" y="768" width="1489" height="68" rx="18" fill="#E6F2FF" stroke="none" stroke-width="1"/><text x="87" y="811" fill="#152744" font-size="20" font-weight="630" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">技术原则：Agent 用 REST 上传可靠数据；后台用 REST 查询 + WSS 看实时变化；初期无需 Next.js、Kafka、Redis。</text><rect x="0" y="853" width="1600" height="47" rx="0" fill="#0B2447" stroke="none" stroke-width="1"/><text x="62" y="883" fill="#D7E8FF" font-size="16" font-weight="550" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">LANVERIQ  /  自托管企业终端活动与审计平台</text><text x="1540" y="883" fill="#B3CAE8" font-size="15" font-weight="600" text-anchor="end" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">设计阶段 · 非真实产品截图  •  03/08</text></svg>