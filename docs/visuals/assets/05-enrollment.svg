ight="339" rx="22" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1"/></g><rect x="442" y="270" width="6" height="339" rx="3" fill="#0891B2" stroke="none" stroke-width="1"/><rect x="468" y="299" width="68" height="68" rx="15" fill="#0891B2" stroke="none" stroke-width="1"/><g transform="translate(486.36,317.36) scale(1.3033333333333335)" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 2 21 6v6c0 6-4 9-9 11-5-2-9-5-9-11V6z"/><path d="m8 12 3 3 5-6"/></g><text x="468" y="413" fill="#152744" font-size="27" font-weight="790" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">2. 终端验证</text><text x="470" y="467" fill="#60738E" font-size="21" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">输入内网服务器地址</text><text x="470" y="501.65" fill="#60738E" font-size="21" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">确认可信 TLS 证书</text><rect x="469" y="561" width="289" height="7" rx="4" fill="#0891B2" stroke="none" stroke-width="1"/><path d="M795 426 H824" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="830" y="270" width="348" height="339" rx="22" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1"/></g><rect x="830" y="270" width="6" height="339" rx="3" fill="#159A69" stroke="none" stroke-width="1"/><rect x="856" y="299" width="68" height="68" rx="15" fill="#159A69" stroke="none" stroke-width="1"/><g transform="translate(874.36,317.36) scale(1.3033333333333335)" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="8" cy="15" r="5"/><path d="M12 12 22 2M17 7l4 4M15 9l3 3"/></g><text x="856" y="413" fill="#152744" font-size="27" font-weight="790" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">3. 创建设备身份</text><text x="858" y="467" fill="#60738E" font-size="21" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">终端生成独立密钥</text><text x="858" y="501.65" fill="#60738E" font-size="21" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">绑定设备与通知策略</text><rect x="857" y="561" width="289" height="7" rx="4" fill="#159A69" stroke="none" stroke-width="1"/><path d="M1183 426 H1212" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1218" y="270" width="348" height="339" rx="22" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1"/></g><rect x="1218" y="270" width="6" height="339" rx="3" fill="#7C3AED" stroke="none" stroke-width="1"/><rect x="1244" y="299" width="68" height="68" rx="15" fill="#7C3AED" stroke="none" stroke-width="1"/><g transform="translate(1262.36,317.36) scale(1.3033333333333335)" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/></g><text x="1244" y="413" fill="#152744" font-size="27" font-weight="790" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">4. 完成接入</text><text x="1246" y="467" fill="#60738E" font-size="21" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">设备在线并开始心跳</text><text x="1246" y="501.65" fill="#60738E" font-size="21" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">服务器记录设备身份</text><rect x="1245" y="561" width="289" height="7" rx="4" fill="#7C3AED" stroke="none" stroke-width="1"/><g filter="url(#shadow)"><rect x="54" y="643" width="1490" height="164" rx="22" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="1"/></g><rect x="54" y="643" width="6" height="164" rx="3" fill="#159A69" stroke="none" stroke-width="1"/><rect x="78" y="670" width="65" height="65" rx="15" fill="#159A69" stroke="none" stroke-width="1"/><g transform="translate(95.55,687.55) scale(1.2458333333333333)" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="5" y="10" width="14" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v3"/></g><text x="163" y="701" fill="#152744" font-size="27" font-weight="780" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">安全约束</text><text x="163" y="741" fill="#60738E" font-size="19" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">不是凭 IP 地址就能信任设备；配对码一次性使用，后续设备拥有可吊销的独立身份。</text><text x="163" y="770.45" fill="#60738E" font-size="19" font-weight="530" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">用户可查看组织采集范围；重装丢失身份后重新配对，不伪造历史记录。</text><rect x="0" y="853" width="1600" height="47" rx="0" fill="#0B2447" stroke="none" stroke-width="1"/><text x="62" y="883" fill="#D7E8FF" font-size="16" font-weight="550" text-anchor="start" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">LANVERIQ  /  自托管企业终端活动与审计平台</text><text x="1540" y="883" fill="#B3CAE8" font-size="15" font-weight="600" text-anchor="end" font-family="Inter,'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">设计阶段 · 非真实产品截图  •  05/08</text></svg>