name: Desktop clean Ubuntu APT simulation proof L1 (no Docker run)

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/tools/verify_desktop_clean_apt_simulation.py'
      - 'apps/desktop/tools/test_verify_desktop_clean_apt_simulation.py'
      - '.github/workflows/desktop-clean-apt-l1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lanveriq-desktop-clean-apt-main
  cancel-in-progress: true
jobs:
  proof-parser:
    name: Synthetic OCI digest/clean-root APT plan rejection tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse source-controlled installer/Agent activation
        run: python3 apps/desktop/tools/verify_desktop_readonly.py
      - name: Verify 16 clean OCI apt -s proof tests without Docker or install
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_clean_apt_simulation.py' -v
          echo 'PASS: L1 synthetic clean Ubuntu OCI proof contract only; real native .deb and docker are L2'
