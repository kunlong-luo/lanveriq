name: GPUI example resource source review (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'tools/gpui_example_resource_review.py'
      - 'tools/test_gpui_example_resource_review.py'
      - 'tools/gpui_debian_source_review.py'
      - '.github/workflows/desktop-gpui-example-resource-review.yml'
      - 'apps/desktop/Cargo.lock'
      - 'apps/desktop/Cargo.lock.sha256'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test resource scope and rejection
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_gpui_example_resource_review.py -v
      - name: Review locked archive without extraction or compilation
        run: |
          python3 tools/gpui_example_resource_review.py
          git diff --exit-code -- apps/desktop/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-example-resource-review
          path: gpui-example-resource-review.json
          if-no-files-found: error
          retention-days: 7
