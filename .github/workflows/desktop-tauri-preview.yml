name: Desktop Tauri 2 offline preview (synthetic L1)

# Noninstalling source/build validation only, not real Pop!_OS host acceptance.
on:
  push:
    branches: [main]
    paths:
      # Avoid repeat native WebKitGTK downloads for docs-only desktop README edits.
      # All source, native config, locks, and build entrypoints still trigger CI.
      - 'apps/desktop/src/**'
      - 'apps/desktop/src-tauri/**'
      # Only inspectors embedded in the GUI and their own safety tests affect
      # preview native output. Offline APT cache helpers have their own CI.
      - 'apps/desktop/tools/verify_desktop_readonly.py'
      - 'apps/desktop/tools/test_verify_desktop_readonly.py'
      - 'apps/desktop/tools/verify_desktop_popos_local_preflight.py'
      - 'apps/desktop/tools/test_verify_desktop_popos_local_preflight.py'
      - 'apps/desktop/tools/verify_desktop_deb_shlibdeps_audit.py'
      - 'apps/desktop/tools/verify_desktop_apt_archive_cache.py'
      - 'apps/desktop/tools/test_verify_desktop_apt_archive_cache.py'
      - 'apps/desktop/package.json'
      - 'apps/desktop/pnpm-lock.yaml'
      - 'apps/desktop/tsconfig.json'
      - 'apps/desktop/vite.config.ts'
      - 'apps/desktop/index.html'
      - 'apps/desktop/.node-version'
      - '.github/workflows/desktop-tauri-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-desktop-preview-main
  # Preserve started expensive native prerequisite diagnostics across commits.
  cancel-in-progress: false

jobs:
  desktop-ui:
    name: React preview and fail-closed privileged-operation guard
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject unsafe native operations, bundle/tray and release-gate bypass
        run: |
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_readonly.py'
          # Same-SHA embedded Python/PopOS negative contract runs before native APT.
          # Includes the actual Ubuntu host refusal; never claims PopOS physical L3.
          /usr/bin/python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_popos_local_preflight.py'
      - name: Set up pinned Node and pnpm
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24.22.3
          working-directory: apps/desktop
          install: false
          require-lockfile: true
          cache: false
      - name: Verify patched runtime
        run: test "$(node --version)" = 'v24.22.3'
      - name: Install committed desktop dependencies frozen
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Test, typecheck and build disconnected UI and nonauthorizing install review
        working-directory: apps/desktop
        run: |
          # Dedicated evidence that no UI checkbox can grant install authority.
          pnpm exec vitest run src/install-review.test.ts src/InstallReviewPanel.test.tsx
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Transfer offline static assets only for native compilation
        uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-web-assets
          path: apps/desktop/dist
          retention-days: 3

  desktop-rust:
    name: Native Tauri and read-only Rust tests (no service install)
    runs-on: ubuntu-24.04
    needs: desktop-ui
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-preview-web-assets
          path: apps/desktop/dist
      - name: Install pinned Rust 1.100
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Verify committed native Cargo dependency lock
        working-directory: apps/desktop/src-tauri
        run: |
          test -f Cargo.lock
          cargo +1.100.0 metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Rustfmt check
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 fmt --all -- --check
      - name: Restore exact audited Ubuntu APT cache (untrusted acceleration only)
        id: native_apt_cache
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/lanveriq-desktop-apt-archives/*.deb
          # Updated two-runner signed-index, exact-closure acceptance: #46113068714 (functional SHA 61b2e9d1).
          # No restore-keys, no prefix fallback and no unreviewed archive source.
          key: lanveriq-ubuntu24-tauri-apt-v2-3392bf02ea332450b3feb0c7695f30c20c46ed955e58d66aa806e4b86cbc1d84
          fail-on-cache-miss: true
      - name: Revalidate 174 independently accepted cached Ubuntu native packages and install CI prerequisites without downloading
        shell: bash
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.native_apt_cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          test "$CACHE_HIT" = true || { echo 'FAIL: audited cache key not restored' >&2; exit 1; }
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          archive=/var/tmp/lanveriq-desktop-apt-archives
          # Independently authenticate the CURRENT runner's Ubuntu APT indexes.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o APT::Get::AllowUnauthenticated=false -o APT::Update::Error-Mode=any update
          packages=(
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
            libssl-dev libxdo-dev patchelf pkg-config python3-apt dpkg-dev
          )
          plan="$RUNNER_TEMP/desktop-preview-apt-plan.txt"
          LC_ALL=C apt-get -s -o Debug::NoLocking=1 -o APT::Install-Recommends=false install "${packages[@]}" > "$plan"
          python3 apps/desktop/tools/verify_desktop_apt_archive_cache.py \
            --archive-dir "$archive" --expected-count 174 \
            --expected-manifest 7dcb274e3d2d2978d8e45f412c36b508aaf4c272235d50da097c990e3fba8458 \
            --expected-plan-file "$plan" \
            --allow-signed-superset
          sudo install -d -o _apt -g root -m 700 "$archive/partial"
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o APT::Get::AllowUnauthenticated=false -o APT::Install-Recommends=false \
            -o Dir::Cache::archives="$archive" \
            --no-download --no-install-recommends install -y "${packages[@]}"
          pkg-config --exists webkit2gtk-4.1 gtk+-3.0
          echo 'PASS: disposable CI native toolchain prerequisites verified from signed APT indexes'
          echo 'BOUNDARY: no GUI .deb or Agent installed, no product signer, no production activation'
      - name: Compile actual Tauri and test native inspectors
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 test --workspace --locked
      - name: Clippy native code
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 clippy --workspace --all-targets --locked -- -D warnings
