name: Desktop Tauri 2 offline preview (synthetic L1)

# Noninstalling source/build validation only, not real Pop!_OS host acceptance.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-tauri-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-desktop-preview-main
  cancel-in-progress: true

jobs:
  desktop-ui:
    name: React preview and fail-closed privileged-operation guard
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject unsafe native operations, bundle/tray and release-gate bypass
        run: |
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_readonly.py'
      - name: Set up pinned Node and pnpm
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24.22.3
          working-directory: apps/desktop
          install: false
          require-lockfile: true
          cache: false
      - name: Verify patched runtime
        run: test "$(node --version)" = 'v24.22.3'
      - name: Install committed desktop dependencies frozen
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Test, typecheck and build disconnected UI
        working-directory: apps/desktop
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Transfer offline static assets only for native compilation
        uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-web-assets
          path: apps/desktop/dist
          retention-days: 3

  desktop-rust:
    name: Native Tauri and read-only Rust tests (no service install)
    runs-on: ubuntu-24.04
    needs: desktop-ui
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-preview-web-assets
          path: apps/desktop/dist
      - name: Install pinned Rust 1.100
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Verify committed native Cargo dependency lock
        working-directory: apps/desktop/src-tauri
        run: |
          test -f Cargo.lock
          cargo +1.100.0 metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Rustfmt check
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 fmt --all -- --check
      - name: Install Ubuntu 24 Tauri WebKitGTK 4.1 build prerequisites
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          # Bounded disposable Ubuntu runner network prerequisites only.
          # Do not change distribution mirrors, install the candidate, or grant GUI authority.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf pkg-config
      - name: Compile actual Tauri and test native inspectors
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 test --workspace --locked
      - name: Clippy native code
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 clippy --workspace --all-targets --locked -- -D warnings
