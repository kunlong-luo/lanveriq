name: One-time merged branch cleanup (2026-11-21)

# Only runs when this exact maintenance workflow is committed to main.
# It must be removed from main after the one-time cleanup is verified.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-merged-branch-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: lanveriq-one-time-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'kunlong-luo/lanveriq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact old heads are contained in main, then delete only these three refs
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [docs/rustdesk-integration-20261108]='33a450ba74f72b67c8ab5307083b662a7c63c813'
            [feat/rustdesk-dual-network-20261108]='6873c1c10075cbddd0acde432c4faeae60268430'
            [security/batch-a-tls13-agent-20261109]='cbbe4a9b01852879b6297efe1ebbcd0889f41943'
          )
          branches=(
            'docs/rustdesk-integration-20261108'
            'feat/rustdesk-dual-network-20261108'
            'security/batch-a-tls13-agent-20261109'
          )
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          for branch in "${branches[@]}"; do
            observed="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            [[ "${observed}" == "${expected[$branch]}" ]] || { echo "REF_MOVED: ${branch}"; exit 1; }
            git merge-base --is-ancestor "${expected[$branch]}" "${GITHUB_SHA}" || { echo "UNMERGED: ${branch}"; exit 1; }
          done
          for branch in "${branches[@]}"; do
            observed="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            [[ "${observed}" == "${expected[$branch]}" ]] || { echo "REF_MOVED_BEFORE_DELETE: ${branch}"; exit 1; }
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "DELETED safely merged ${branch}"
          done
