name: Desktop actual Agent package Signed-By APT OCI L2 (CI-only)

# Real locked Rust Agent .deb from current main, real native APT install/reinstall/remove
# only in an ephemeral pinned Ubuntu24 networkless OCI, with throwaway signer.
# This NEVER signs for release, installs to host, runs polkit or enables Agent.
on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/src/**'
      - 'apps/agent/Cargo.toml'
      - 'apps/agent/Cargo.lock'
      - 'apps/agent/rust-toolchain.toml'
      - 'apps/agent/deploy/systemd/lanveriq-agent.service'
      - 'apps/agent/tools/linux/build-offline-agent-deb.sh'
      - 'apps/agent/tools/linux/verify-offline-agent-deb.py'
      - 'apps/agent/tools/linux/verify-systemd-popos24.py'
      - 'apps/desktop/tools/verify_desktop_agent_signed_apt_oci_lab.py'
      - 'apps/desktop/tools/test_signed_apt_index_replay.py'
      - 'apps/desktop/tools/verify_signed_apt_witness_oci.sh'
      - 'apps/desktop/tools/agent-signed-apt-oci-inner.sh'
      - '.github/workflows/desktop-agent-signed-apt-oci-l2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-signed-agent-apt-oci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-agent-apt-oci:
    name: Native signed APT 20 OCI cases with cold-cache double replay and RO anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LANVERIQ_SIGNED_AGENT_APT_L2: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout historical Agent source at exact reviewed commit, without credentials
        uses: actions/checkout@v7
        with:
          ref: cd031894048dfcdc479aeaddd72e6254abde7303
          path: l2b31-historical
          persist-credentials: false
          sparse-checkout: |
            apps/agent
      - name: Negative guard - never run on host without CI and consent
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile apps/desktop/tools/verify_desktop_agent_signed_apt_oci_lab.py
          bash -n apps/desktop/tools/agent-signed-apt-oci-inner.sh
          bash -n apps/desktop/tools/verify_signed_apt_witness_oci.sh
          # Pass the COMPLETE argument shape so a usage error cannot masquerade
          # as the actual CI-only/consent denial we intend to test.
          if rejection="$(GITHUB_ACTIONS=false python3 apps/desktop/tools/verify_desktop_agent_signed_apt_oci_lab.py /bin/true /bin/true 2>&1)"; then
            echo 'FAIL: host lab accepted non-CI invocation' >&2
            exit 1
          fi
          printf '%s\n' "$rejection" | grep -F 'CI-only, unprivileged Linux runner with explicit lab consent' > /dev/null || {
            echo 'FAIL: host lab refused for a reason other than environment guard' >&2
            exit 1
          }
          if rejection="$(env -u LANVERIQ_SIGNED_AGENT_APT_L2 python3 apps/desktop/tools/verify_desktop_agent_signed_apt_oci_lab.py /bin/true /bin/true 2>&1)"; then
            echo 'FAIL: host lab accepted missing consent' >&2
            exit 1
          fi
          printf '%s\n' "$rejection" | grep -F 'CI-only, unprivileged Linux runner with explicit lab consent' > /dev/null || {
            echo 'FAIL: missing-consent scenario was not denied by actual environment guard' >&2
            exit 1
          }
          echo 'PASS: correct CI-only and missing-consent guard executed, not argument usage rejection'
      - name: Local package-index revision fixture negative checks
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s apps/desktop/tools -p 'test_signed_apt_index_replay.py' -v
      - name: Install reviewed Rust 1.100 toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Compile actual locked release Rust Agent; audit its native Debian archive
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/agent
          cargo +1.100.0 build --release --locked -p lanveriq-agent
          test -x target/release/lanveriq-agent
          tmp=$(mktemp -d -t lanveriq-l2b23-actual-agent.XXXXXXXX)
          echo "LANVERIQ_L2B23_TEMP=$tmp" >> "$GITHUB_ENV"
          bash tools/linux/build-offline-agent-deb.sh target/release/lanveriq-agent "$tmp"
          python3 tools/linux/verify-offline-agent-deb.py "$tmp/lanveriq-agent-offline-preview_0.1.0~dev1_amd64.deb"
      - name: Compile pinned historical Agent source to a genuinely different Rust ELF
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C l2b31-historical rev-parse HEAD)" = cd031894048dfcdc479aeaddd72e6254abde7303
          if cmp -s apps/agent/src/inventory_platform.rs l2b31-historical/apps/agent/src/inventory_platform.rs; then
            echo 'NOT_APPROVED: historical and current Rust inventory sources are identical' >&2
            exit 1
          fi
          cargo +1.100.0 build --release --locked -p lanveriq-agent \
            --manifest-path l2b31-historical/apps/agent/Cargo.toml
          history_elf=l2b31-historical/apps/agent/target/release/lanveriq-agent
          latest_elf=apps/agent/target/release/lanveriq-agent
          test -x "$history_elf" && test -x "$latest_elf"
          if cmp -s "$history_elf" "$latest_elf"; then
            echo 'NOT_APPROVED: pinned historical and current Cargo ELFs identical' >&2
            exit 1
          fi
          echo 'PASS: pinned original Git source builds different Rust ELF; CI-only, no signing authority'
      - name: Actual APT real Agent lifecycle, 8 refusals and signed stale Release/index replay in networkless OCI
        shell: bash
        run: |
          set -Eeuo pipefail
          # The CI runner is never the APT/dpkg target; script uses docker --network none,
          # --cap-drop ALL, no-new-privileges, a read-only local signed repo and a pinned OCI.
          python3 apps/desktop/tools/verify_desktop_agent_signed_apt_oci_lab.py \
            "$LANVERIQ_L2B23_TEMP/lanveriq-agent-offline-preview_0.1.0~dev1_amd64.deb" \
            "$GITHUB_WORKSPACE/l2b31-historical/apps/agent/target/release/lanveriq-agent"
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 apps/desktop/tools/verify_desktop_polkit_review.py
          echo 'PASS: 20 native OCI APT cases incl cold-cache jointly replayed signed Packages/witness rejected by separately RO-mounted CI anchor; still NO independent high-water'
