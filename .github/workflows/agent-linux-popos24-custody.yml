name: Linux Pop!_OS 24.04 Agent custody (isolated synthetic L2)

# Linux-first Pop!_OS 24.04 target. CI uses ubuntu-24.04, which shares
# the systemd/Linux DAC foundation, but is NOT a real System76/Pop!_OS host.
# No real service is installed/enabled and no collection/remote is started.
on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/deploy/systemd/lanveriq-agent.service'
      - 'apps/agent/examples/linux_csr_synthetic.rs'
      - 'apps/agent/src/enrollment_linux.rs'
      - 'apps/agent/tools/linux/**'
      - '.github/workflows/agent-linux-popos24-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-linux-popos24-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu24-linux-uid-custody:
    name: Linux systemd/DAC and OpenSSL P-256 synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Negative-test systemd idle-policy under normal and optimized Python (-O)
        run: python3 -m unittest discover -s apps/agent/tools/linux -p 'test_verify_systemd_popos24.py'
      - name: Reject unsafe .deb package payloads and lifecycle metadata (synthetic fixtures)
        run: python3 -m unittest discover -s apps/agent/tools/linux -p 'test_verify_offline_agent_deb.py'
      - name: Reject false installed-service claims and hostile effective systemd properties
        run: python3 -m unittest discover -s apps/agent/tools/linux -p 'test_verify_installed_agent_idle.py'
      - name: Validate CI-only real dpkg lifecycle lab cannot run on unapproved hosts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n apps/agent/tools/linux/verify-disposable-agent-dpkg-lifecycle.sh
          if env -u LANVERIQ_DISPOSABLE_DPKG_L2 bash apps/agent/tools/linux/verify-disposable-agent-dpkg-lifecycle.sh /bin/true; then
            echo 'FAIL: dpkg lifecycle lab permitted without explicit CI consent' >&2
            exit 1
          fi
          if GITHUB_ACTIONS=false LANVERIQ_DISPOSABLE_DPKG_L2=1 bash apps/agent/tools/linux/verify-disposable-agent-dpkg-lifecycle.sh /bin/true; then
            echo 'FAIL: dpkg lifecycle lab permitted outside GitHub CI' >&2
            exit 1
          fi
          echo 'PASS: lifecycle script refuses unapproved host invocation'
      - name: Confirm clean runner cannot pretend to be an installed approved Agent
        shell: bash
        run: |
          set -Eeuo pipefail
          result=$(python3 apps/agent/tools/linux/verify-installed-agent-idle.py 2>&1) && {
            echo 'FAIL: disposable Ubuntu runner falsely passed installed-service audit'
            exit 1
          }
          case "$result" in
            NOT_APPROVED:*) echo "PASS: uninstalled CI runner denied by read-only installed-unit audit";;
            *) echo 'FAIL: expected explicit fail-closed installed-unit refusal'; exit 1;;
          esac
      - name: Check Pop!_OS 24.04 idle-service security policy
        run: python3 apps/agent/tools/linux/verify-systemd-popos24.py apps/agent/deploy/systemd/lanveriq-agent.service
      - name: Verify systemd unit syntax without installing or starting
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          # The REAL ExecStart is separately asserted by the Python gate.
          # systemd-analyze verify also insists that the binary is installed,
          # which is intentionally NOT true on a disposable CI runner.
          sed 's@^ExecStart=/usr/bin/lanveriq-agent .*@ExecStart=/usr/bin/true@' \
            apps/agent/deploy/systemd/lanveriq-agent.service > "$tmp/lanveriq-agent.service"
          grep -Fx 'ExecStart=/usr/bin/true' "$tmp/lanveriq-agent.service"
          systemd-analyze verify "$tmp/lanveriq-agent.service"
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build Linux synthetic-only CSR helper (production Agent remains idle)
        working-directory: apps/agent
        run: cargo +1.100.0 build --example linux_csr_synthetic --locked
      - name: Verify distinct Unix accounts cannot read/write owner CSR private key
        run: sudo bash apps/agent/tools/linux/verify-linux-csr-uid.sh apps/agent/target/debug/examples/linux_csr_synthetic
      - name: Build actual locked Rust release and validate nonactivating native Debian package in temporary root
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/agent
          cargo +1.100.0 build --release --locked -p lanveriq-agent
          test -x target/release/lanveriq-agent
          tmp=$(mktemp -d -t lanveriq-deb-ci.XXXXXXXX)
          trap 'rm -rf --one-file-system -- "$tmp"' EXIT
          bash tools/linux/build-offline-agent-deb.sh target/release/lanveriq-agent "$tmp"
          python3 tools/linux/verify-offline-agent-deb.py "$tmp/lanveriq-agent-offline-preview_0.1.0~dev1_amd64.deb"
          # LNX4: actual dpkg -i, same-version reinstall and dpkg -r, strictly
          # inside a disposable, networkless pinned Ubuntu24 OCI container.
          # Never install the Agent on the CI runner or a real Pop!_OS device.
          LANVERIQ_DISPOSABLE_DPKG_L2=1 bash tools/linux/verify-disposable-agent-dpkg-lifecycle.sh \
            "$tmp/lanveriq-agent-offline-preview_0.1.0~dev1_amd64.deb"
      - name: Verify isolated systemd DynamicUser key custody across two service invocations
        # A transient synthetic systemd-run unit, never LanveriqAgent or a
        # permanent installed system service. No actual Pop!_OS host.
        run: |
          sudo bash apps/agent/tools/linux/verify-systemd-dynamic-restart.sh \
            apps/agent/target/debug/examples/linux_csr_synthetic \
            apps/agent/tools/linux/systemd-csr-dynamic-stage.sh
