name: RustDesk R2-01 two real synthetic peers (offline container lab)

# Controlled proof of upstream client registration, NOT remote pixels or WAN.
# Each job uses one unique ephemeral project and Docker internal:true network,
# without any published ports, service accounts or real operating-system data.
on:
  pull_request:
    paths:
      - 'deploy/rustdesk/lab/**'
      - '.github/workflows/rustdesk-two-peers.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/rustdesk/lab/**'
      - '.github/workflows/rustdesk-two-peers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-two-peers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-isolated-linux-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      LANVERIQ_R2_SYNTHETIC: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate R2 topology and registration-evidence verifier offline
        run: |
          python3 -m py_compile deploy/rustdesk/lab/verify.py deploy/rustdesk/lab/test_verify.py deploy/rustdesk/lab/run.py
          python3 -m unittest discover -s deploy/rustdesk/lab -p 'test_verify.py' -v
      - name: Reuse immutable official RustDesk 1.5.1 client package
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rustdesk-1.5.1-x86_64.deb
          key: rustdesk-1.5.1-linux-amd64-b5d682ad90cb7571ecbdbf26eef58d3c4514e726a74ef6d08ce3f0b114ef0bd9
      - name: Download original stable asset only if cache missed
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 12 --max-time 150 \
            --proto '=https' --tlsv1.2 \
            'https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-x86_64.deb' \
            --output "$RUNNER_TEMP/rustdesk-1.5.1-x86_64.deb"
      - name: Verify binary bytes and build disposable synthetic clients
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/rustdesk/verify_client_release.py \
            --asset linux-amd64-deb \
            --file "$RUNNER_TEMP/rustdesk-1.5.1-x86_64.deb"
          cp "$RUNNER_TEMP/rustdesk-1.5.1-x86_64.deb" deploy/rustdesk/lab/
          trap 'rm -f deploy/rustdesk/lab/rustdesk-1.5.1-x86_64.deb' EXIT
          docker build --file deploy/rustdesk/lab/Dockerfile.client \
            --tag lanveriq-rustdesk-client-1.5.1:r2-local-only \
            deploy/rustdesk/lab
      - name: Verify actual rendered network isolation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/rustdesk/lab/compose.yml config --format json |
            python3 -c 'import json,sys;sys.path.insert(0,"deploy/rustdesk/lab");from verify import verify_topology;print(json.dumps(verify_topology(json.load(sys.stdin))))'
      - name: Start real OSS server and TWO official Linux client processes in isolated network
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/rustdesk/lab/run.py
          echo 'PASS means exactly two real upstream RustDesk client registrations were observed in hbbs SQLite on a Docker internal network; it does NOT prove remote desktop, WAN, ICE/P2P or relay session.' >> "$GITHUB_STEP_SUMMARY"
