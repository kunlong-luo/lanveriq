name: GPUI read-only query process boundary (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/gpui-candidate/src/runtime_metadata.rs'
      - 'apps/desktop/gpui-candidate/src/host_identity.rs'
      - 'apps/desktop/gpui-candidate/src/graphics.rs'
      - 'apps/desktop/gpui-candidate/src/review.rs'
      - 'apps/desktop/gpui-candidate/src/lib.rs'
      - '.github/workflows/desktop-gpui-query-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust and compile actual dependency-free library test harness
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          test "$(id -u)" -ne 0
          rustc +1.100.0 --edition=2024 --test apps/desktop/gpui-candidate/src/lib.rs -o "$RUNNER_TEMP/gpui-query-tests"
      - name: Run library model tests and real fixed synthetic timeout fixtures
        run: |
          "$RUNNER_TEMP/gpui-query-tests" --test-threads=1
          timeout --kill-after=5s 35s "$RUNNER_TEMP/gpui-query-tests" --ignored live_query_boundary --test-threads=1 --nocapture
