name: GPUI read-only query process boundary (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src/runtime_metadata.rs'
      - 'apps/desktop/src/host_identity.rs'
      - 'apps/desktop/src/graphics.rs'
      - 'apps/desktop/src/review.rs'
      - 'apps/desktop/src/lib.rs'
      - 'apps/agent/src/transport.rs'
      - '.github/workflows/desktop-gpui-query-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check offline draft stays aligned with exact Agent origin
        run: |
          python3 - <<'PY'
          import pathlib, re
          agent = pathlib.Path("apps/agent/src/transport.rs").read_text()
          desktop = pathlib.Path("apps/desktop/src/lib.rs").read_text()
          def origin(source, name):
              matches = re.findall(r'const ' + name + r': &str = "([^"]+)";', source)
              assert len(matches) == 1, name
              return matches[0]
          assert origin(agent, "AGENT_ORIGIN") == origin(desktop, "AGENT_DRAFT_ORIGIN")
          assert "if origin != AGENT_ORIGIN {" in agent
          assert "if origin == AGENT_DRAFT_ORIGIN {" in desktop
          PY
      - name: Install pinned Rust and compile actual dependency-free library test harness
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          test "$(id -u)" -ne 0
          rustc +1.100.0 --edition=2024 --test apps/desktop/src/lib.rs -o "$RUNNER_TEMP/gpui-query-tests"
      - name: Run library model tests and real fixed synthetic timeout fixtures
        run: |
          "$RUNNER_TEMP/gpui-query-tests" --test-threads=1
          timeout --kill-after=5s 35s "$RUNNER_TEMP/gpui-query-tests" --ignored live_query_boundary --test-threads=1 --nocapture
