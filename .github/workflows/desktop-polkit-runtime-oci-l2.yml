name: Desktop native Polkit daemon denial L2 (isolated OCI only)

# Install OS polkitd/dbus only into a disposable Ubuntu24 Docker build image.
# This job NEVER installs a policy, broker, Agent or privileges on runner/host.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/polkit/org.lanveriq.agent.package.policy'
      - 'apps/desktop/tools/verify_desktop_polkit_review.py'
      - 'apps/desktop/tools/test_verify_desktop_polkit_review.py'
      - 'apps/desktop/tools/polkit-runtime-oci.Dockerfile'
      - 'apps/desktop/tools/test_polkit_runtime_oci.sh'
      - 'apps/desktop/tools/polkit-fixed-action-gate.rs'
      - 'apps/desktop/tools/polkit-oci-dbus-broker-lab.py'
      - 'apps/desktop/tools/polkit-oci-dbus-review.conf'
      - 'apps/desktop/tools/test_polkit_dbus_broker_oci.sh'
      - '.github/workflows/desktop-polkit-runtime-oci-l2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-polkit-runtime-oci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-polkit-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify source policy remains inert and unable to grant install rights
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_polkit_review.py' -v
          python3 apps/desktop/tools/verify_desktop_polkit_review.py
          bash -n apps/desktop/tools/test_polkit_runtime_oci.sh
      - name: Compile and test Rust 1.100 fixed-action Polkit request gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          gate_dir=$(mktemp -d -t lanveriq-polkit-gate.XXXXXXXX)
          chmod 0755 "$gate_dir"
          echo "LANVERIQ_POLKIT_GATE=$gate_dir" >> "$GITHUB_ENV"
          rustc +1.100.0 --edition=2024 --test \
            apps/desktop/tools/polkit-fixed-action-gate.rs -o "$gate_dir/gate-tests"
          "$gate_dir/gate-tests"
          rustc +1.100.0 --edition=2024 -C opt-level=2 \
            apps/desktop/tools/polkit-fixed-action-gate.rs -o "$gate_dir/polkit-fixed-action-gate"
          test -x "$gate_dir/polkit-fixed-action-gate"
      - name: Build disposable Ubuntu24 image with upstream polkitd and DBus
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f apps/desktop/tools/polkit-runtime-oci.Dockerfile \
            -t lanveriq-polkit-runtime-ci-only:local .
      - name: Actual polkitd and system DBus reject six unprivileged OS subjects
        shell: bash
        run: |
          set -Eeuo pipefail
          # Upstream Polkit's DBus activation needs a setuid helper only in OCI.
          # Network NONE, no host system DBus mount, no host auth material.
          docker run --rm --interactive \
            --network none \
            --pids-limit 128 --memory 512m --cpus 1 \
            --mount "type=bind,src=$PWD/apps/desktop/polkit,dst=/mnt/lanveriq-policy,readonly" \
            --mount "type=bind,src=$LANVERIQ_POLKIT_GATE,dst=/mnt/lanveriq-gate,readonly" \
            --env LANVERIQ_POLKIT_RUNTIME_L2=disposable-oci-only \
            --entrypoint /bin/bash \
            lanveriq-polkit-runtime-ci-only:local -seuo pipefail \
            < apps/desktop/tools/test_polkit_runtime_oci.sh
          python3 apps/desktop/tools/verify_desktop_readonly.py
          echo 'PASS: native OS authorization check is L2-only and has not enabled Tauri install'
      - name: Real root-side D-Bus review verifies sender Unix credentials and refuses replay
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile apps/desktop/tools/polkit-oci-dbus-broker-lab.py
          bash -n apps/desktop/tools/test_polkit_dbus_broker_oci.sh
          docker run --rm --interactive \
            --network none \
            --pids-limit 128 --memory 512m --cpus 1 \
            --mount "type=bind,src=$PWD/apps/desktop/polkit,dst=/mnt/lanveriq-policy,readonly" \
            --mount "type=bind,src=$PWD/apps/desktop/tools,dst=/mnt/lanveriq-broker-source,readonly" \
            --env LANVERIQ_POLKIT_RUNTIME_L2=disposable-oci-only \
            --entrypoint /bin/bash \
            lanveriq-polkit-runtime-ci-only:local -seuo pipefail \
            < apps/desktop/tools/test_polkit_dbus_broker_oci.sh
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 apps/desktop/tools/verify_desktop_polkit_review.py
          echo 'PASS: root-side OCI D-Bus peer review did not create an installer or grant Polkit authorization'
