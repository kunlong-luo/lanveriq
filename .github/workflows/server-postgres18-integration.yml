name: PostgreSQL 18 integration (manual, synthetic-only)

# Never runs on push/PR. No real employee data, certificates, credentials,
# LAN access or monitored endpoints. Operator starts it explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-manual-pg18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres18-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure official Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate approved Gradle Wrapper checksum
        working-directory: apps/server
        run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Confirm isolated Docker engine is available
        run: docker info --format 'Docker server {{.ServerVersion}}'
      - name: Run Testcontainers PostgreSQL 18.6 Flyway + real transaction tests
        working-directory: apps/server
        run: ./gradlew integrationTest --stacktrace
