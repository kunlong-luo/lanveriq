name: PostgreSQL 18 integration (manual, synthetic-only)

# A11 milestone-only main push paths run real disposable PG18 regression;
# all other source/doc pushes remain manual. No real users, production secrets,
# LAN endpoints, certificate issuers or monitored devices.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/server/src/main/resources/db/migration/V14__durable_first_pin_double_review.sql'
      - 'apps/server/src/main/resources/db/migration/V15__bind_first_pin_review_to_step_up_proof.sql'
      - 'apps/server/src/main/java/com/lanveriq/server/enrollment/FirstPinReviewStepUpVerifier.java'
      - 'apps/server/src/main/java/com/lanveriq/server/enrollment/DenyAllFirstPinReviewStepUpVerifier.java'
      - 'apps/server/build.gradle'
      - 'apps/server/src/main/java/com/lanveriq/server/security/ConsoleSessionSecurityConfiguration.java'
      - 'apps/server/src/integrationTest/java/com/lanveriq/server/security/PostgreSqlConsoleSecurityWiringIT.java'
      - 'apps/server/src/main/java/com/lanveriq/server/enrollment/FirstPinReviewLedgerService.java'
      - 'apps/server/src/integrationTest/java/com/lanveriq/server/enrollment/PostgreSqlFirstPinDoubleReviewIT.java'
      - 'apps/server/src/integrationTest/java/com/lanveriq/server/events/PostgreSqlDeviceActivationIT.java'
      - 'apps/server/scripts/assert-postgres18-junit.py'
      - '.github/workflows/server-postgres18-integration.yml'

permissions:
  contents: read

# Keep manually requested acceptance independent. For scoped push
# regressions only the newest main SHA matters; stop older duplicate Docker
# runs instead of queuing expensive stale-SHA acceptance.
concurrency:
  group: lanveriq-pg18-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  postgres18-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure official Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate approved Gradle Wrapper checksum
        working-directory: apps/server
        run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Confirm isolated Docker engine is available
        run: docker info --format 'Docker server {{.ServerVersion}}'
      - name: Run Testcontainers PostgreSQL 18.6 Flyway + real transaction tests
        working-directory: apps/server
        # Always execute test methods in this dispatched run; no cached test
        # outputs can substitute for fresh database and lock evidence.
        run: ./gradlew --no-build-cache --rerun-tasks integrationTest --stacktrace
      # A zero-exit Gradle task alone does not prove each security gate ran.
      # Require real Gradle JUnit XML for all nine Testcontainers classes,
      # the PostgreSQL 18.6/Flyway assertion, and all critical negative cases, including Console servlet security,
      # including first-admin bootstrap and session-audit atomic rollback.
      - name: Fail closed if mandatory PostgreSQL tests were skipped or missing
        # Also report evidence gaps after a failed integrationTest task; never
        # mask the original Gradle failure or convert it into acceptance.
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: python3 scripts/assert-postgres18-junit.py build/test-results/integrationTest
      - name: Record synthetic PostgreSQL image and commit provenance
        if: always()
        run: |
          printf 'Tested Git commit: %s\n' "$GITHUB_SHA"
          printf 'Expected PostgreSQL image tag: postgres:18.6\n'
          if docker image inspect postgres:18.6 \
            --format 'Image ID: {{.Id}}; repository digests: {{json .RepoDigests}}'; then
            :
          else
            echo 'PostgreSQL image unavailable; no digest evidence captured.'
          fi
      - name: Archive short-lived synthetic JUnit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: srv03-pg18-synthetic-junit
          path: apps/server/build/test-results/integrationTest/*.xml
          if-no-files-found: warn
          retention-days: 7
