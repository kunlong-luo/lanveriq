name: Desktop Ubuntu24 WebKitGTK prerequisite plan (read-only diagnostic)

# Fast runner facts before any native install; NOT an ABI/release/installer approval.
# No network refresh, sudo, package install, service activation or artifact upload.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-ubuntu-apt-plan-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-desktop-apt-diagnostic-main
  cancel-in-progress: false

jobs:
  apt-plan:
    name: Ubuntu runner APT candidate and no-install simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse desktop installer authority before host diagnostic
        run: |
          set -Eeuo pipefail
          python3 apps/desktop/tools/verify_desktop_readonly.py
      - name: Read distro, image, indexed package candidates and simulate prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          printf 'RUNNER_OS=%s RUNNER_IMAGE=%s RUNNER_IMAGE_VERSION=%s\n' "$ID:$VERSION_ID" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
          # The same Ubuntu24 build-development prerequisites as the strict
          # desktop-deb-candidate workflow; this job NEVER fetches or installs.
          packages=(
            libwebkit2gtk-4.1-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libssl-dev
            libxdo-dev
            patchelf
            pkg-config
            python3-apt
            dpkg-dev
          )
          apt-cache policy "${packages[@]}"
          plan="$RUNNER_TEMP/desktop-ubuntu-apt-simulation.log"
          apt-get -s -o Debug::NoLocking=1 -o APT::Install-Recommends=false install "${packages[@]}" > "$plan"
          python3 - "$plan" <<'PY'
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          install = [line for line in lines if line.startswith("Inst ")]
          remove = [line for line in lines if line.startswith(("Remv ", "Purg "))]
          if remove:
              raise SystemExit("FAIL: host prerequisite plan contains removal/purge")
          print("APT simulated install or upgrade count:", len(install))
          print("APT simulated install package names:", ", ".join(
              sorted({line.split()[1] for line in install})
          ))
          print("APT simulated removal count:", len(remove))
          if not any(re.search(r"^(Inst )?libwebkit2gtk-4\.1-dev\b", line) for line in lines):
              raise SystemExit("FAIL: WebKitGTK prerequisite absent from local APT plan")
          print("PASS: Ubuntu24 local cached APT index resolves prerequisite metadata only")
          print("NOT RUN: apt-get update, download, install, native Tauri, Clippy, .deb archive, PopOS L3")
          print("CAVEAT: runner apt indexes may be stale; simulated candidates are not an approved pinned image")
          PY
