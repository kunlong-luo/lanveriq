name: Next.js real Chromium UI preview (milestone, synthetic-only)

# Milestone-only real Chromium keyboard, responsive and safe-route checks for
# the canonical Next.js App Router. The browser sees only the production-built
# disconnected 127.0.0.1:3100 preview. NO Spring/PG18/Agent services, real
# credentials, monitoring or deployment. This is NOT a console-auth approval.
on:
  # L3 only: avoid rebuilding/booting Chromium for each UI source commit.
  push:
    tags:
      - 'acceptance/v0.1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-nxt02-browser-synthetic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  next-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: /tmp/lanveriq-nxt02-playwright-browsers
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up locked pnpm 12 and Node 24
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web-next
          install: true
          require-lockfile: true
          cache: false
      - name: Build authentic Next.js production preview (no live APIs)
        working-directory: apps/web-next
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify:routes
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Install pinned Python Playwright and its Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lanveriq-nxt02-playwright"
          "$RUNNER_TEMP/lanveriq-nxt02-playwright/bin/python" -m pip install --disable-pip-version-check 'playwright==1.64.1'
          "$RUNNER_TEMP/lanveriq-nxt02-playwright/bin/python" -m playwright install --with-deps chromium
          python3 -m py_compile apps/web-next/scripts/verify-preview-chromium.py
          python3 -m py_compile apps/web-next/scripts/capture-visual-qa-chromium.py
          python3 -m py_compile apps/web-next/scripts/verify-directory-fixture-chromium.py
          python3 -m unittest discover -s apps/web-next/scripts -p 'test_verify_preview_chromium.py'
      - name: Run true Chromium UI, keyboard and network-isolation checks
        working-directory: apps/web-next
        shell: bash
        run: |
          set -euo pipefail
          if (echo > /dev/tcp/127.0.0.1/3100) >/dev/null 2>&1; then
            echo "FAIL: loopback Next.js browser port already in use"
            exit 1
          fi
          # pnpm exec may spawn Next.js as a child. Start a dedicated process
          # group so the exit trap kills BOTH the launcher and next-server.
          setsid pnpm exec next start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/nxt02-next.log" 2>&1 &
          next_pid=$!
          trap 'kill -TERM -- "-$next_pid" >/dev/null 2>&1 || true; wait "$next_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 80); do
            kill -0 "$next_pid" >/dev/null 2>&1 || {
              echo "FAIL: Next.js production server exited before browser test"
              exit 1
            }
            status="$(curl --silent --noproxy '*' --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/overview || true)"
            if [[ "$status" == 200 ]]; then
              ready=1
              break
            fi
            sleep 0.5
          done
          [[ "$ready" == 1 ]] || { echo "FAIL: isolated Next.js did not become ready"; exit 1; }
          "$RUNNER_TEMP/lanveriq-nxt02-playwright/bin/python" scripts/verify-preview-chromium.py
          LANVERIQ_NXT18_VISUAL_DIR="$RUNNER_TEMP/lanveriq-nxt18-visual-qa" \
            "$RUNNER_TEMP/lanveriq-nxt02-playwright/bin/python" scripts/capture-visual-qa-chromium.py
          echo "PASS: real Chromium Next.js preview and 15 screenshots; no backend login approval."
      - name: Publish disconnected-only NXT-18 visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxt18-visual-qa-${{ github.sha }}
          path: ${{ runner.temp }}/lanveriq-nxt18-visual-qa/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Verify interactive local filters in a disposable CI-only directory route
        working-directory: apps/web-next
        shell: bash
        env:
          LANVERIQ_NXT17_BROWSER_FIXTURE: '1'
        run: |
          set -euo pipefail
          # Verify the normal disconnected preview above FIRST. The fixture
          # is mounted only after that separate production build and browser
          # pass. This second build is never published and has no backend.
          if (echo > /dev/tcp/127.0.0.1/3100) >/dev/null 2>&1; then
            echo "FAIL: loopback port already in use before CI-only fixture"
            exit 1
          fi
          next_pid=
          trap 'if [[ -n "${next_pid:-}" ]]; then kill -TERM -- "-$next_pid" >/dev/null 2>&1 || true; wait "$next_pid" >/dev/null 2>&1 || true; fi; rm -rf src/app/synthetic-directory-probe' EXIT
          node scripts/install-synthetic-directory-fixture.mjs
          pnpm typecheck
          pnpm build
          setsid pnpm exec next start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/nxt17-directory.log" 2>&1 &
          next_pid=$!
          ready=0
          for _ in $(seq 1 80); do
            kill -0 "$next_pid" >/dev/null 2>&1 || {
              echo "FAIL: CI-only Next.js directory fixture exited"
              exit 1
            }
            status="$(curl --silent --noproxy '*' --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/synthetic-directory-probe || true)"
            if [[ "$status" == 200 ]]; then
              ready=1
              break
            fi
            sleep 0.5
          done
          [[ "$ready" == 1 ]] || { echo "FAIL: isolated directory fixture did not become ready"; exit 1; }
          "$RUNNER_TEMP/lanveriq-nxt02-playwright/bin/python" scripts/verify-directory-fixture-chromium.py
          echo "PASS: disposable authorized-directory interactions; no credentials, backend, or public fixture."

