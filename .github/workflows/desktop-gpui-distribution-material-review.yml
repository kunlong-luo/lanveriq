name: GPUI distribution material review (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'tools/gpui_distribution_material_review.py'
      - 'tools/test_gpui_distribution_material_review.py'
      - '.github/workflows/desktop-gpui-distribution-material-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test source path and byte integrity
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_gpui_distribution_material_review.py -v
      - name: Fetch locked registry sources (no compilation)
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cd apps/desktop/gpui-candidate
          sha256sum --check --strict Cargo.lock.sha256
          cargo +1.100.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/registry-metadata.json"
          git diff --exit-code -- Cargo.lock Cargo.toml
      - name: Assemble actual license bytes and resource review index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 15258190239 15258301989 15258131714; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$id.zip"
          done
          python3 tools/gpui_distribution_material_review.py distribution-material-review "$RUNNER_TEMP/registry-metadata.json" apps/desktop/gpui-candidate/Cargo.lock \
            15258190239.zip a647b3c2d63ff54b3f1794ae6d03e84068ac0ff71d51ab3f7cae7f8b91a677b1 \
            15258301989.zip 7ff459f4d1da720067173c2b87f1cd0f3288bf9c6b2864be9bf99cfcf0da1f1f \
            15258131714.zip 0ab0d822ff3f7941636d5f3b0cafa0119459cb7e24061aa952daaaca07f50efd
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-distribution-material-REVIEW-ONLY
          path: distribution-material-review/
          if-no-files-found: error
          retention-days: 7
