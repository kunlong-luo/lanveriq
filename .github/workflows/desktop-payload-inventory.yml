name: Desktop delivered Debian payload L1 inventory (synthetic no install)
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/tools/verify_desktop_payload_evidence.py'
      - 'apps/desktop/tools/test_verify_desktop_payload_evidence.py'
      - 'apps/desktop/tools/verify-desktop-deb.py'
      - 'apps/desktop/tools/verify_desktop_candidate_evidence.py'
      - '.github/workflows/desktop-payload-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lanveriq-desktop-payload-l1-main
  cancel-in-progress: true
jobs:
  synthetic-inventory:
    name: Strict Debian archive bytes versus extracted payload negative tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce read-only GUI and payload byte consistency
        run: |
          set -Eeuo pipefail
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_payload_evidence.py' -v
          echo 'PASS: synthetic L1 only; native Debian Syft payload scan NOT RUN in this job'
