name: Next.js fast source and preview checks
on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-unit.yml'
      - 'docs/README.md'
      - 'docs/CURRENT_STATUS.md'
      - 'docs/governance/documentation-index-snapshot-2026-11-21.md'
      - 'README.md'
      - 'README.zh.md'
      - 'docs/development/standards.md'
      - 'docs/development/technology.md'
      - 'docs/development/frontend-design-system.md'
      - 'docs/development/nextjs-single-ui-consolidation-2026-11-21.md'
      - 'docs/development/nextjs-path-rename-nxt24-2026-11-21.md'
      - 'docs/testing/nextjs-nxt02-manual.md'
      - 'docs/architecture/adrs/0008-nextjs-app-router-console.md'
      - 'docs/operations/release.md'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-unit.yml'
      - 'docs/README.md'
      - 'docs/CURRENT_STATUS.md'
      - 'docs/governance/documentation-index-snapshot-2026-11-21.md'
      - 'README.md'
      - 'README.zh.md'
      - 'docs/development/standards.md'
      - 'docs/development/technology.md'
      - 'docs/development/frontend-design-system.md'
      - 'docs/development/nextjs-single-ui-consolidation-2026-11-21.md'
      - 'docs/development/nextjs-path-rename-nxt24-2026-11-21.md'
      - 'docs/testing/nextjs-nxt02-manual.md'
      - 'docs/architecture/adrs/0008-nextjs-app-router-console.md'
      - 'docs/operations/release.md'
permissions:
  contents: read

concurrency:
  group: lanveriq-web-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pinned pnpm 12 and Node 24 (lockfile required)
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web
          install: true
          require-lockfile: true
          cache: false
      - name: Fail closed on dependency drift (frozen pnpm lockfile)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Enforce one canonical Next.js UI and no legacy Vite runner
        working-directory: apps/web
        run: |
          node scripts/verify-single-ui.mjs
          node --test scripts/test_verify_single_ui.mjs
      - name: Verify current documentation authority, local links and negative cases
        working-directory: apps/web
        run: |
          node scripts/verify-documentation-baseline.mjs
          node --test scripts/test_verify_documentation_baseline.mjs
      - name: Regress transitive source-level authentication isolation (NO runtime)
        working-directory: apps/web
        run: node --test scripts/test_runtime_isolation.mjs
      - name: Verify native scrollbar hidden without disabling page scrolling
        working-directory: apps/web
        run: node --test scripts/test_viewport_scrollbar.mjs
      - name: Verify the canonical Next.js operations visual contract
        working-directory: apps/web
        run: node --test scripts/test_console_visual_source.mjs
      - name: Check no API proxy or reachable credential route
        working-directory: apps/web
        run: pnpm run verify:routes
      - name: Verify manual Chromium gate source only (NO browser or network)
        working-directory: apps/web
        run: |
          python3 -m py_compile scripts/verify-preview-chromium.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run synthetic-only Next.js component tests
        working-directory: apps/web
        run: pnpm test
      - name: Typecheck and build production Next.js candidate
        working-directory: apps/web
        run: |
          pnpm typecheck
          pnpm build
      - name: Smoke-test actual production Next.js preview HTTP routes
        working-directory: apps/web
        run: node scripts/verify-built-pages.mjs
