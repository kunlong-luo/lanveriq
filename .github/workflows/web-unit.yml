name: Web synthetic preview checks
on:
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-unit.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-unit.yml'
permissions:
  contents: read
jobs:
  web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pinned pnpm 12 and Node 24 from checked-in lockfile
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web
          install: true
          require-lockfile: true
          cache: false
      - name: Fail closed on dependency drift (frozen lockfile)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Run synthetic-only UI unit tests
        working-directory: apps/web
        run: pnpm test
      - name: Exercise real Vite health-only proxy against synthetic local backend
        working-directory: apps/web
        run: node scripts/verify-health-proxy.mjs
      - name: Typecheck and compile static UI preview
        working-directory: apps/web
        run: pnpm build
