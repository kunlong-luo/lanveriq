name: Spring Tomcat upstream-mTLS (manual, synthetic-only)

# Never runs on push/PR. Generates short-lived synthetic PKI and PostgreSQL
# on a GitHub-hosted isolated runner; does not open Agent REST/API routes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-manual-tomcat-upstream-mtls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spring-tomcat-synthetic-mtls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure pinned Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure official Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify isolated tooling and exact Git commit
        run: |
          printf 'Tested Git SHA: %s\n' "$GITHUB_SHA"
          docker info --format 'Docker server {{.ServerVersion}}'
          openssl version
          curl --version | head -n 1
          java -version
          keytool -help >/dev/null
      - name: Check default-OFF manual test harness syntax
        run: bash -n apps/server/scripts/verify-agent-upstream-tls.sh
      - name: Execute real Spring Tomcat and PostgreSQL 18.6 TLS negative probes
        run: bash apps/server/scripts/verify-agent-upstream-tls.sh
