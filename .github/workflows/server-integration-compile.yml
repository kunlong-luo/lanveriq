name: PostgreSQL integration source compilation (L1, no containers)

# Independent compile guard for Java DTO and JPA contract changes. Standard
# 'test' does not compile integrationTest; this caught stale constructor
# callsites after Batch A heartbeat request_id became mandatory.
# This job compiles Testcontainers tests; it NEVER starts Docker or PostgreSQL.
on:
  push:
    branches: [main]
    paths:
      - 'apps/server/src/main/java/**'
      - 'apps/server/src/integrationTest/**'
      - 'apps/server/build.gradle'
      - 'apps/server/settings.gradle'
      - '.github/workflows/server-integration-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-integration-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile all JUnit/Testcontainers integration sources (no Docker/DB)
        working-directory: apps/server
        run: ./gradlew compileIntegrationTestJava --no-daemon
      - name: Record evidence limitation
        if: success()
        run: echo "PASS: integrationTest Java compiled. NOT RUN: PostgreSQL18, migration, mTLS, runtime, real endpoints."
