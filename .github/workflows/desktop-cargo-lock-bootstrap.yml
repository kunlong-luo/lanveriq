name: Desktop Cargo lock bootstrap (temporary no-install)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-cargo-lock-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust 1.100
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Generate actual Tauri Cargo.lock without compiling or installing
        working-directory: apps/desktop/src-tauri
        run: cargo +1.100.0 generate-lockfile
      - name: Export generated lock as inspectable base64 for source commit
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/Cargo.lock')
          print('LANVERIQ_DESKTOP_CARGO_LOCK_B64=' + base64.b64encode(path.read_bytes()).decode('ascii'))
          PY
