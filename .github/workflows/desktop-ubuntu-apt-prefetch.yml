name: Desktop Ubuntu24 Tauri APT signed-index prefetch lab (no install)

# Separate experimental cache warmer for Ubuntu 24.04 Tauri WebKitGTK.
# This workflow does NOT produce, install, sign or distribute Lanveriq.
# A GHA cache is untrusted acceleration; future build jobs must independently
# check signed Ubuntu indexes and real packages before using cached archives.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-ubuntu-apt-prefetch.yml'
      # Consumers must not silently reuse the last native ABI cache when their
      # audited prerequisite set changes; regenerate an authenticated exact
      # closure and have a second runner verify it before editing pins.
      - '.github/workflows/desktop-tauri-preview.yml'
      - '.github/workflows/desktop-deb-candidate.yml'
      - 'apps/desktop/tools/verify_desktop_apt_archive_cache.py'
      - 'apps/desktop/tools/test_verify_desktop_apt_archive_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-desktop-apt-prefetch-main
  cancel-in-progress: false

jobs:
  prefetch:
    name: Signed Ubuntu APT metadata and download-only cache laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      cache_key: ${{ steps.plan.outputs.cache_key }}
      archive_count: ${{ steps.download.outputs.archive_count }}
      archive_sha256: ${{ steps.download.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source remains read-only and runner remains Ubuntu24 amd64
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_apt_archive_cache.py' -v
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          command -v apt-get >/dev/null
          command -v sha256sum >/dev/null
          printf 'PREWARM RUNNER=%s IMAGE=%s SHA=%s\n' "$ID:$VERSION_ID" "${ImageVersion:-unknown}" "$GITHUB_SHA"
      - name: Resolve signed Ubuntu APT indexes and hash full simulated plan
        id: plan
        timeout-minutes: 10
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only use runner's existing distro repo configuration and APT
          # signature verification; never rewrite URLs or disable auth.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          packages=(
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
            libssl-dev libxdo-dev patchelf pkg-config python3-apt dpkg-dev
          )
          plan="$RUNNER_TEMP/lanveriq-apt-prefetch-plan.txt"
          apt-get -s -o Debug::NoLocking=1 -o APT::Install-Recommends=false install "${packages[@]}" > "$plan"
          if grep -Eq '^(Remv|Purg) ' "$plan"; then
            echo 'FAIL: prerequisite plan proposes removing packages' >&2
            exit 1
          fi
          grep -q '^Inst libwebkit2gtk-4.1-dev ' "$plan" || {
            echo 'FAIL: missing native WebKitGTK development prerequisite' >&2
            exit 1
          }
          # Include ALL transitive versioned installs, selected signed-index
          # sources, runner image version and arch in exact-cache identity.
          # Only hashes, not potentially sensitive APT source text, are logged.
          fingerprint="$(
            {
              printf '%s\n' "$GITHUB_REPOSITORY" "${ImageVersion:-unknown}"
              dpkg --print-architecture
              find /etc/apt -maxdepth 2 -type f \( -name '*.sources' -o -name '*.list' \) -print0 |
                sort -z | xargs -0 -r sha256sum
              cat "$plan"
            } | sha256sum | cut -d ' ' -f 1
          )"
          echo "cache_key=lanveriq-ubuntu24-tauri-apt-v2-$fingerprint" >> "$GITHUB_OUTPUT"
          printf 'APT signed-index plan sha256: %s\n' "$(sha256sum "$plan" | cut -d ' ' -f 1)"
          printf 'APT planned package install/upgrade count: %s\n' "$(grep -c '^Inst ' "$plan" || true)"
          printf 'APT planned removals: 0; image: %s; download-only below\n' "${ImageVersion:-unknown}"
          # The github runner owns the outer cache so action/cache can restore
          # it, while the official apt _apt sandbox owns only partial/.
          # /var/tmp is traversable by _apt; runner.temp may not be.
          archive="/var/tmp/lanveriq-desktop-apt-archives"
          mkdir -p "$archive"
          chmod 755 "$archive"
          sudo install -d -o _apt -g root -m 700 "$archive/partial"
      - name: Read or preserve downloaded Ubuntu APT archives (acceleration, untrusted)
        uses: actions/cache@v4
        with:
          # Only cache complete .deb files: omit apt's root-only lock and
          # _apt-private partial/ directory (prior run couldn't archive them).
          path: /var/tmp/lanveriq-desktop-apt-archives/*.deb
          key: ${{ steps.plan.outputs.cache_key }}
      - name: Download signed-index APT archives only, never install
        id: download
        timeout-minutes: 35
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="/var/tmp/lanveriq-desktop-apt-archives"
          test -d "$archive/partial"
          test "$(stat -c '%U' "$archive/partial")" = _apt
          test "$(stat -c '%a' "$archive/partial")" = 700
          dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' | LC_ALL=C sort > "$RUNNER_TEMP/lanveriq-dpkg-before.txt"
          # The official apt downloader validates each archive against Ubuntu
          # signed indexes. Nothing is installed; no host package set changes.
          # Preserve apt's warnings for a real fail-closed sandbox check;
          # pipefail makes any download/verification failure fatal.
          log="$RUNNER_TEMP/lanveriq-desktop-prefetch-apt.log"
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 -o APT::Install-Recommends=false \
            -o Dir::Cache::archives="$archive" -o APT::Keep-Downloaded-Packages=true \
            -y --download-only install \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf pkg-config python3-apt dpkg-dev 2>&1 | tee "$log"
          if grep -Eqi 'download is performed unsandboxed|pkgacquire::run.*permission denied' "$log"; then
            echo 'FAIL: APT download escaped the _apt sandbox' >&2
            exit 1
          fi
          dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' | LC_ALL=C sort > "$RUNNER_TEMP/lanveriq-dpkg-after.txt"
          cmp "$RUNNER_TEMP/lanveriq-dpkg-before.txt" "$RUNNER_TEMP/lanveriq-dpkg-after.txt" || {
            echo 'FAIL: download-only job changed installed dpkg package states' >&2
            exit 1
          }
          count="$(find "$archive" -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$count" -gt 0
          echo "archive_count=$count" >> "$GITHUB_OUTPUT"
          # Bind byte-for-byte restored files, not merely their count, across
          # independent runner jobs. No archive content is executed or parsed.
          archive_sha256="$(find "$archive" -maxdepth 1 -type f -name '*.deb' -print0 |
            sort -z | xargs -0 -r sha256sum | sha256sum | cut -d ' ' -f 1)"
          test -n "$archive_sha256"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "PASS: Ubuntu apt verified $count archives against signed indexes; installed package states unchanged"
          echo "EXPECTED archive manifest SHA256: $archive_sha256"
          echo 'BOUNDARY: CI cache is not a signed immutable builder, ABI acceptance, release artifact or PopOS L3'
  cache-probe:
    name: Independent runner restores all cached Debian archives
    needs: prefetch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify offline hostile-cache rejection tests in fresh runner
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_apt_archive_cache.py' -v
      - name: Restore only prefetch job's exact signed-index plan cache
        id: restored
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/lanveriq-desktop-apt-archives/*.deb
          key: ${{ needs.prefetch.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Refresh authenticated Ubuntu package indexes for independent cache verification
        timeout-minutes: 9
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          # Uses only the runner's configured Ubuntu sources and APT signature
          # policy. Never permits unauthenticated metadata or source rewriting.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o APT::Get::AllowUnauthenticated=false update
          # The independent runner must demand the same selected package set,
          # not merely Ubuntu-origin hashes of unrelated extra archives.
          plan="$RUNNER_TEMP/lanveriq-apt-restored-closure.txt"
          apt-get -s -o Debug::NoLocking=1 -o APT::Install-Recommends=false install \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf pkg-config python3-apt dpkg-dev > "$plan"
          test -s "$plan"
          printf 'RECEIVER authenticated APT planned install count: %s\\n' "$(grep -c '^Inst ' "$plan" || true)"
          printf 'RECEIVER authenticated APT plan SHA256: %s\\n' "$(sha256sum "$plan" | cut -d ' ' -f 1)"
          # Not a pass criterion; this reports differences between Ubuntu
          # runner base images without exposing local machine identities.
          python3 - "$plan" /var/tmp/lanveriq-desktop-apt-archives <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'apps/desktop/tools')
          from verify_desktop_apt_archive_cache import parse_install_plan, parse_archive_name
          planned = parse_install_plan(pathlib.Path(sys.argv[1]).read_text())
          cached = dict(parse_archive_name(p.name)[:2] for p in pathlib.Path(sys.argv[2]).glob('*.deb'))
          missing = sorted(name for name, version in planned.items() if cached.get(name) != version)
          extra = sorted(set(cached) - set(planned))
          print('RECEIVER required package/version absent from producer cache:', len(missing))
          print('RECEIVER producer-cache entries not in current install plan:', len(extra))
          print('RECEIVER missing selected APT package names:', ','.join(missing) if missing else 'none')
          PY
      - name: Verify independent runner cache bytes AND signed-index package SHA256
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
          EXPECTED_COUNT: ${{ needs.prefetch.outputs.archive_count }}
          EXPECTED_SHA256: ${{ needs.prefetch.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          test "$CACHE_HIT" = true
          test "$EXPECTED_COUNT" -gt 0
          archive="/var/tmp/lanveriq-desktop-apt-archives"
          count="$(find "$archive" -maxdepth 1 -type f -name '*.deb' -readable | wc -l)"
          test "$count" -eq "$EXPECTED_COUNT"
          digest="$(find "$archive" -maxdepth 1 -type f -name '*.deb' -print0 |
            sort -z | xargs -0 -r sha256sum | sha256sum | cut -d ' ' -f 1)"
          test -n "$EXPECTED_SHA256"
          if test "$digest" != "$EXPECTED_SHA256"; then
            echo 'FAIL: independent runner restored archives with a different byte manifest' >&2
            exit 1
          fi
          # The restored cache is untrusted even if it matches the producer's
          # manifest. Verify every package name, epoch/version, architecture,
          # byte size and SHA256 against this runner's fresh, signed APT index.
          python3 apps/desktop/tools/verify_desktop_apt_archive_cache.py \
            --archive-dir "$archive" --expected-count "$EXPECTED_COUNT" \
            --expected-manifest "$EXPECTED_SHA256" \
            --expected-plan-file "$RUNNER_TEMP/lanveriq-apt-restored-closure.txt" \
            --allow-signed-superset
          echo "PASS: independent Ubuntu24 runner rechecked every byte of the producer cache against signed indexes and covered its actual APT plan"
          echo 'UNTRUSTED: cache remains acceleration; actual native build must revalidate its own APT environment'
          echo 'NOT RUN: package installation, Rust/Clippy, GUI-only .deb, PopOS L3 or production Agent'
