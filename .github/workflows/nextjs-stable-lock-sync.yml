name: Next.js stable dependency lock synchronization

# Only source-controlled stable manifest changes may trigger this temporary
# maintenance gate. This job NEVER accesses production services or secrets.
# Remove the workflow after the migration has completed.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web-next/package.json'

permissions:
  contents: write

concurrency:
  group: lanveriq-nextjs-stable-lock-main
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Pin Node 24 and pnpm 12
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web-next
          install: false
          cache: false
      - name: Resolve exactly the reviewed Next.js stable dependency manifest
        working-directory: apps/web-next
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json");if(p.dependencies.next!=="16.4.5")process.exit(1)'
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run verify:routes
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Commit exact generated pnpm lockfile (no secrets or build files)
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/web-next/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Next.js lockfile already synchronized.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock reviewed Next.js 16.4.5 stable dependency tree'
          git push origin HEAD:main
