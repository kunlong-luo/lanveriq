name: Desktop GUI-only .deb candidate (uninstalled synthetic package audit)

# Milestone-sized package build, intentionally separate from routine desktop L1.
# No distribution or downloadable artifact. Does not package/install/enable Agent.
on:
  push:
    branches: [main]
    paths:
      # A candidate must be rebuilt when packaged GUI/Rust source or locked
      # build inputs change; README/doc-only pushes do not trigger this L2 job.
      - 'apps/desktop/src/**'
      - 'apps/desktop/src-tauri/src/**'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/Cargo.lock'
      - 'apps/desktop/src-tauri/build.rs'
      - 'apps/desktop/src-tauri/capabilities/**'
      - 'apps/desktop/src-tauri/rust-toolchain.toml'
      - 'apps/desktop/.node-version'
      - 'apps/desktop/package.json'
      - 'apps/desktop/pnpm-lock.yaml'
      - 'apps/desktop/vite.config.ts'
      - 'apps/desktop/tsconfig.json'
      - 'apps/desktop/index.html'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/icons/**'
      - 'apps/desktop/tools/verify-desktop-deb.py'
      - 'apps/desktop/tools/test_verify_desktop_deb.py'
      - 'apps/desktop/tools/verify_desktop_candidate_evidence.py'
      - 'apps/desktop/tools/test_verify_desktop_candidate_evidence.py'
      - 'apps/desktop/tools/verify_desktop_lab_signature.py'
      - 'apps/desktop/tools/test_verify_desktop_lab_signature.py'
      - 'apps/desktop/tools/verify_desktop_payload_evidence.py'
      - 'apps/desktop/tools/test_verify_desktop_payload_evidence.py'
      - 'apps/desktop/tools/verify_desktop_elf_runtime_evidence.py'
      - 'apps/desktop/tools/test_verify_desktop_elf_runtime_evidence.py'
      - 'apps/desktop/tools/verify_desktop_ubuntu_runtime_packages.py'
      - 'apps/desktop/tools/test_verify_desktop_ubuntu_runtime_packages.py'
      - 'apps/desktop/tools/verify_desktop_apt_installed_closure.py'
      - 'apps/desktop/tools/test_verify_desktop_apt_installed_closure.py'
      - 'apps/desktop/tools/verify_desktop_deb_shlibdeps_audit.py'
      - 'apps/desktop/tools/test_verify_desktop_deb_shlibdeps_audit.py'
      - 'apps/desktop/tools/verify_desktop_clean_apt_simulation.py'
      - 'apps/desktop/tools/test_verify_desktop_clean_apt_simulation.py'
      - 'apps/desktop/tools/verify_desktop_popos_local_preflight.py'
      - 'apps/desktop/tools/test_verify_desktop_popos_local_preflight.py'
      - 'apps/desktop/tools/verify_desktop_readonly.py'
      - 'apps/desktop/tools/test_verify_desktop_readonly.py'
      - 'apps/desktop/tools/verify_desktop_apt_archive_cache.py'
      - 'apps/desktop/tools/test_verify_desktop_apt_archive_cache.py'
      - '.github/workflows/desktop-deb-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-desktop-gui-deb-candidate-main
  # Preserve expensive started native/ABI evidence across main pushes.
  # Later commits queue their own check instead of cancelling the active run.
  cancel-in-progress: false

jobs:
  gui-only-deb:
    name: Actual Tauri native Debian bundle + hostile archive negatives
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse installer/service activation in source and verify synthetic package mutations
        run: |
          python3 apps/desktop/tools/verify_desktop_readonly.py
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_readonly.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_apt_archive_cache.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_deb.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_candidate_evidence.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_lab_signature.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_payload_evidence.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_elf_runtime_evidence.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_ubuntu_runtime_packages.py'
          /usr/bin/python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_apt_installed_closure.py'
          /usr/bin/python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_deb_shlibdeps_audit.py'
          python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_clean_apt_simulation.py'
          /usr/bin/python3 -m unittest discover -s apps/desktop/tools -p 'test_verify_desktop_popos_local_preflight.py'
      - name: Install pinned frontend runtime without changing pnpm lock
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24.22.3
          working-directory: apps/desktop
          install: false
          require-lockfile: true
          cache: false
      - name: Verify Node runtime
        run: test "$(node --version)" = v24.22.3
      - name: Frozen desktop dependency graph and source tests
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Install pinned Rust 1.100
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
      - name: Refuse Cargo lock changes
        working-directory: apps/desktop/src-tauri
        run: |
          cargo +1.100.0 metadata --locked --no-deps --format-version 1 > /dev/null
          cargo +1.100.0 fmt --all -- --check
      - name: Restore exact independently audited Ubuntu APT archive cache (never trust bytes)
        id: native_apt_cache
        uses: actions/cache/restore@v4
        with:
          # Deliberately pinned to complete two-runner signed-index verification
          # #46113068714 (SHA 61b2e9d1); no fallback/restore-keys. Rotation requires
          # a reviewed main commit and fresh independent L2B-14 acceptance.
          path: /var/tmp/lanveriq-desktop-apt-archives/*.deb
          key: lanveriq-ubuntu24-tauri-apt-v2-3392bf02ea332450b3feb0c7695f30c20c46ed955e58d66aa806e4b86cbc1d84
          fail-on-cache-miss: true
      - name: Independently authenticate EVERY cached native dependency and install offline in disposable runner
        timeout-minutes: 15
        shell: bash
        env:
          CACHE_HIT: ${{ steps.native_apt_cache.outputs.cache-hit }}
          EXPECTED_ARCHIVE_COUNT: '174'
          EXPECTED_ARCHIVE_SHA256: 7dcb274e3d2d2978d8e45f412c36b508aaf4c272235d50da097c990e3fba8458
        run: |
          set -Eeuo pipefail
          test "$CACHE_HIT" = true || { echo 'FAIL: exact audited APT cache missing' >&2; exit 1; }
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          archive=/var/tmp/lanveriq-desktop-apt-archives
          test -d "$archive"
          # Use only the build runner's OWN authenticated Ubuntu indexes.
          # An index update failure or a changed dependency closure is fatal.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o APT::Get::AllowUnauthenticated=false -o APT::Update::Error-Mode=any update
          packages=(
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
            libssl-dev libxdo-dev patchelf pkg-config python3-apt dpkg-dev
          )
          plan="$RUNNER_TEMP/desktop-native-apt-closure.txt"
          LC_ALL=C apt-get -s -o Debug::NoLocking=1 -o APT::Install-Recommends=false install "${packages[@]}" > "$plan"
          # The cache is merely a transport. Each restored .deb MUST match a
          # name/version/arch/size/hash in this runner's signed Ubuntu APT
          # index AND the exact simulated install closure and manifest.
          python3 apps/desktop/tools/verify_desktop_apt_archive_cache.py \
            --archive-dir "$archive" --expected-count "$EXPECTED_ARCHIVE_COUNT" \
            --expected-manifest "$EXPECTED_ARCHIVE_SHA256" --expected-plan-file "$plan" \
            --allow-signed-superset
          # Never fetch archive bytes from network in this stage. Installation
          # concerns disposable CI build headers ONLY, never Lanveriq .deb.
          sudo install -d -o _apt -g root -m 700 "$archive/partial"
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o APT::Get::AllowUnauthenticated=false \
            -o APT::Install-Recommends=false \
            -o Dir::Cache::archives="$archive" \
            --no-download --no-install-recommends install -y "${packages[@]}"
          pkg-config --exists webkit2gtk-4.1 gtk+-3.0
          echo 'PASS: all required current-runner APT packages are in fully signed-index-verified cache; no package downloads'
          echo 'NOT RUN: candidate .deb install, Agent install, signer, PopOS L3 or production authority'
      - name: Same-SHA native Rust read-only tests and strict Clippy before .deb audit
        working-directory: apps/desktop/src-tauri
        run: |
          cargo +1.100.0 test --workspace --locked
          cargo +1.100.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile actual unsigned GUI-only .deb using temporary CLI-only override; never install it
        shell: bash
        working-directory: apps/desktop
        run: |
          set -Eeuo pipefail
          # Source config stays bundle.active=false. This override exists only in
          # this disposable CI job and does NOT include the Agent or service unit.
          # Main source uses a stable lowercase package identity to avoid spaces in
          # .desktop/PNG/payload names; all installer authority remains OFF.
          override='{"bundle":{"active":true,"targets":["deb"]}}'
          pnpm tauri build --ci --no-sign --bundles deb --config "$override"
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.lock
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [[ ! -f "$package" ]]; then
            printf 'FAIL: no Tauri Desktop .deb was produced\n' >&2
            exit 1
          fi
          count=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)
          if (( count != 1 )); then
            printf 'FAIL: expected exactly one unsigned desktop-only Debian candidate\n' >&2
            exit 1
          fi
          python3 tools/verify-desktop-deb.py "$package"
          # APT read-only simulation on this already-provisioned Ubuntu24 runner;
          # no installation, no change of system package state, NOT a clean PopOS L3.
          apt-get -s -o Debug::NoLocking=1 install "$PWD/$package"
          sha256sum -- "$package"
          echo 'PASS: unsigned unapproved GUI-only candidate inspected in disposable CI; not installed, enabled, uploaded or published'
      - name: Source-only SPDX using pinned Anchore Syft, no artifact uploads
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: apps/desktop
          format: spdx-json
          syft-version: v1.54.0
          output-file: ${{ runner.temp }}/desktop-source.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Bind unsigned candidate to source SPDX and locks; never sign or install
        working-directory: apps/desktop
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          python3 tools/verify_desktop_candidate_evidence.py create --package "$package" --sbom "$EVIDENCE_DIR/desktop-source.spdx.json" --cargo-lock src-tauri/Cargo.lock --pnpm-lock pnpm-lock.yaml --tauri-config src-tauri/tauri.conf.json --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/receipt.json"
          python3 tools/verify_desktop_candidate_evidence.py verify --package "$package" --sbom "$EVIDENCE_DIR/desktop-source.spdx.json" --cargo-lock src-tauri/Cargo.lock --pnpm-lock pnpm-lock.yaml --tauri-config src-tauri/tauri.conf.json --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/receipt.json"
          cat "$EVIDENCE_DIR/receipt.json"
          echo 'PASS: unsigned, untrusted local integrity only; no signing, uploading, publishing or installing'
      - name: Extract strictly audited GUI archive to disposable Syft scan root, no install
        shell: bash
        working-directory: apps/desktop
        env:
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          python3 tools/verify-desktop-deb.py "$package"
          test ! -e "$EVIDENCE_DIR/desktop-payload-root"
          mkdir -m 700 "$EVIDENCE_DIR/desktop-payload-root"
          dpkg-deb --extract "$package" "$EVIDENCE_DIR/desktop-payload-root"
          test -f "$EVIDENCE_DIR/desktop-payload-root/usr/bin/lanveriq-desktop"
          echo 'PASS: GUI-only package unpacked in runner temp; no install, no execution'
      - name: Anchore Syft pinned scan of actual delivered .deb payload only
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/desktop-payload-root
          format: spdx-json
          syft-version: v1.54.0
          output-file: ${{ runner.temp }}/desktop-payload.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Cross-check exact archive bytes and partial payload Syft SPDX against source receipt
        shell: bash
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          args=(--package "$package" --extracted "$EVIDENCE_DIR/desktop-payload-root" --payload-spdx "$EVIDENCE_DIR/desktop-payload.spdx.json" --source-receipt "$EVIDENCE_DIR/receipt.json" --source-spdx "$EVIDENCE_DIR/desktop-source.spdx.json" --cargo-lock src-tauri/Cargo.lock --pnpm-lock pnpm-lock.yaml --tauri-config src-tauri/tauri.conf.json --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/payload-evidence.json")
          python3 tools/verify_desktop_payload_evidence.py create "${args[@]}"
          python3 tools/verify_desktop_payload_evidence.py verify "${args[@]}"
          cat "$EVIDENCE_DIR/payload-evidence.json"
          echo 'PASS: delivered file hashes bound, Syft payload evidence partial only; NOT A COMPLETE RUNTIME SBOM OR RELEASE'
      - name: Record strict readelf direct SONAME, ELF loader and Debian Depends without executing binary
        shell: bash
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          command -v readelf >/dev/null
          test -f "$EVIDENCE_DIR/payload-evidence.json"
          # Diagnostic is read-only: print the actual DT_NEEDED rows even if
          # the strict SONAME parser later refuses an unreviewed library.
          LC_ALL=C readelf --wide --dynamic "$EVIDENCE_DIR/desktop-payload-root/usr/bin/lanveriq-desktop" | grep '(NEEDED)'
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          args=(--package "$package" --extracted "$EVIDENCE_DIR/desktop-payload-root" --payload-spdx "$EVIDENCE_DIR/desktop-payload.spdx.json" --source-receipt "$EVIDENCE_DIR/receipt.json" --source-spdx "$EVIDENCE_DIR/desktop-source.spdx.json" --payload-evidence "$EVIDENCE_DIR/payload-evidence.json" --cargo-lock src-tauri/Cargo.lock --pnpm-lock pnpm-lock.yaml --tauri-config src-tauri/tauri.conf.json --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/runtime-elf-evidence.json")
          python3 tools/verify_desktop_elf_runtime_evidence.py create "${args[@]}"
          python3 tools/verify_desktop_elf_runtime_evidence.py verify "${args[@]}"
          cat "$EVIDENCE_DIR/runtime-elf-evidence.json"
          echo 'PASS: ELF directly-linked SONAME/loader/stack and Debian Depends examined without executing ELF; LICENSE/TRANSITIVE ABI STILL UNVERIFIED'
      - name: Map actual 15 ELF SONAMEs to Ubuntu24 installed package versions and copyright material
        shell: bash
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          test -f "$EVIDENCE_DIR/runtime-elf-evidence.json"
          test -f "$EVIDENCE_DIR/desktop-payload-root/usr/bin/lanveriq-desktop"
          args=(--runtime-report "$EVIDENCE_DIR/runtime-elf-evidence.json" --binary "$EVIDENCE_DIR/desktop-payload-root/usr/bin/lanveriq-desktop" --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/ubuntu-host-library-map.json")
          python3 tools/verify_desktop_ubuntu_runtime_packages.py create "${args[@]}"
          python3 tools/verify_desktop_ubuntu_runtime_packages.py verify "${args[@]}"
          cat "$EVIDENCE_DIR/ubuntu-host-library-map.json"
          echo 'PASS: Ubuntu 24 host package ownership/copyright hashes captured; NOT A POP!_OS RUNTIME OR LEGAL APPROVAL'
      - name: APT read-only installed mandatory dependency satisfiers, versions and legal inputs
        shell: bash
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          test -f "$EVIDENCE_DIR/ubuntu-host-library-map.json"
          /usr/bin/python3 -c 'import apt; assert apt.Cache()["libc6"].installed is not None'
          args=(--owner-report "$EVIDENCE_DIR/ubuntu-host-library-map.json" --runtime-report "$EVIDENCE_DIR/runtime-elf-evidence.json" --binary "$EVIDENCE_DIR/desktop-payload-root/usr/bin/lanveriq-desktop" --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/apt-installed-dependency-evidence.json")
          /usr/bin/python3 tools/verify_desktop_apt_installed_closure.py create "${args[@]}"
          /usr/bin/python3 tools/verify_desktop_apt_installed_closure.py verify "${args[@]}"
          /usr/bin/python3 - "$EVIDENCE_DIR/apt-installed-dependency-evidence.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding="utf-8"))
          print("L2B-7 APT installed package count:",data["apt_installed_package_count"])
          print("L2B-7 mandatory dependency OR groups:",data["apt_dependency_or_group_count"])
          print("L2B-7 ambiguous installed alternatives:",data["apt_ambiguous_installed_choices"])
          print("L2B-7 copyright materials missing:",data["copyright_missing_count"])
          print("L2B-7 graph SHA256:",data["apt_graph_sha256"])
          assert data["license_review"]=="OPEN_NOT_APPROVED"
          assert not data["release_approved"] and not data["install_authorized"]
          PY
          echo 'PASS: read-only APT installed mandatory satisfier graph; no PopOS, runtime plugins, license or release approval'
      - name: Official Debian dpkg-shlibdeps ABI minimum vs packaged Depends (read-only untrusted audit)
        shell: bash
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          command -v dpkg-shlibdeps >/dev/null
          test -f "$EVIDENCE_DIR/apt-installed-dependency-evidence.json"
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          args=(--package "$package" --extraction "$EVIDENCE_DIR/desktop-payload-root" --runtime-report "$EVIDENCE_DIR/runtime-elf-evidence.json" --owner-report "$EVIDENCE_DIR/ubuntu-host-library-map.json" --apt-report "$EVIDENCE_DIR/apt-installed-dependency-evidence.json" --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$EVIDENCE_DIR/deb-shlibdeps-gap-evidence.json")
          /usr/bin/python3 tools/verify_desktop_deb_shlibdeps_audit.py create "${args[@]}"
          /usr/bin/python3 tools/verify_desktop_deb_shlibdeps_audit.py verify "${args[@]}"
          /usr/bin/python3 - "$EVIDENCE_DIR/deb-shlibdeps-gap-evidence.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          comparison=data["comparison"]
          print("ABI official dpkg-shlibdeps required groups:",comparison["calculated_direct_group_count"])
          print("ABI archive declared groups:",comparison["archive_declared_group_count"])
          print("ABI not directly declared groups:",len(comparison["not_directly_declared_groups"]))
          print("ABI too-weak declared version groups:",len(comparison["declared_but_insufficient_constraint_groups"]))
          print("ABI direct declaration gap count:",comparison["direct_declaration_gap_count"])
          print("ABI generated Debian requirement expression:",data["official_generated_shlibs_depends"])
          print("ABI actual Debian control Depends:",data["archive_actual_depends"])
          print("ABI gap evidence remains unsigned:",data["direct_package_metadata"])
          assert comparison["direct_declaration_gap_count"] == 0, "NO_APPROVAL: ABI minimum not covered by candidate .deb"
          assert data["direct_package_metadata"] == "NO_GAP_DETECTED_UNAPPROVED"
          print("PASS: official dpkg-shlibdeps Ubuntu24 direct-version declaration gaps = 0; NO RELEASE APPROVAL")
          assert data["license_review"]=="OPEN_NOT_APPROVED"
          assert not data["release_approved"] and not data["install_authorized"]
          PY
          echo 'PASS: official shlibdeps ABI audit recorded; packaging compatibility and release still NOT APPROVED'
      - name: L2B-10 clean Ubuntu24 OCI APT simulation with read-only package and immutable image digest
        shell: bash
        working-directory: apps/desktop
        timeout-minutes: 15
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          command -v docker >/dev/null
          test -f "$EVIDENCE_DIR/deb-shlibdeps-gap-evidence.json"
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          args=(--package "$package" --previous "$EVIDENCE_DIR/deb-shlibdeps-gap-evidence.json" --log "$EVIDENCE_DIR/clean-ubuntu-apt-stdout.txt" --output "$EVIDENCE_DIR/clean-ubuntu-apt-proof.json" --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT")
          python3 tools/verify_desktop_clean_apt_simulation.py collect "${args[@]}"
          python3 tools/verify_desktop_clean_apt_simulation.py verify "${args[@]}"
          python3 - "$EVIDENCE_DIR/clean-ubuntu-apt-proof.json" <<'PY'
          import json,sys
          record=json.load(open(sys.argv[1],encoding="utf-8"))
          print("L2B-10 clean Ubuntu OCI pinned resolved manifest:",record["oci_resolved_manifest_digest"])
          print("L2B-10 pristine installed package count:",record["simulation"]["initial_installed_package_count"])
          print("L2B-10 simulated install actions:",record["simulation"]["planned_install_count"])
          print("L2B-10 removals:",record["simulation"]["planned_removal_count"])
          print("L2B-10 .deb SHA256:",record["deb_sha256"])
          assert record["apt_action"]=="SIMULATE_ONLY_NO_PACKAGES_INSTALLED"
          assert record["pop_os_24_cosmic"]=="NOT_TESTED"
          assert not record["release_approved"] and not record["install_authorized"]
          PY
          echo 'PASS: clean disposable Ubuntu24 OCI APT resolution only; no install, PopOS, COSMIC or Agent authorization'
      - name: LAB ONLY prove offline detached Ed25519 verification with ephemeral test key
        shell: bash
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          LAB_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          umask 077
          private="$LAB_DIR/desktop-lab-ephemeral-private-key.pem"
          public="$LAB_DIR/desktop-lab-ephemeral-public-key.pem"
          signature="$LAB_DIR/desktop-lab-ephemeral-receipt.sig"
          trap 'rm -f -- "$private" "$public" "$signature"' EXIT
          test ! -e "$private" && test ! -e "$public" && test ! -e "$signature"
          openssl genpkey -algorithm ED25519 -out "$private"
          openssl pkey -in "$private" -pubout -out "$public"
          openssl pkeyutl -sign -rawin -inkey "$private" -in "$LAB_DIR/receipt.json" -out "$signature"
          pub_sha=$(sha256sum "$public" | cut -d ' ' -f 1)
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -f "$package"
          python3 tools/verify_desktop_lab_signature.py \
            --receipt "$LAB_DIR/receipt.json" --signature "$signature" \
            --public-key "$public" --lab-pubkey-sha256 "$pub_sha" \
            --package "$package" --sbom "$LAB_DIR/desktop-source.spdx.json" \
            --cargo-lock src-tauri/Cargo.lock --pnpm-lock pnpm-lock.yaml \
            --tauri-config src-tauri/tauri.conf.json --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT"
          echo 'PASS: EPHEMERAL LAB KEY ONLY; no trusted publisher, release signature or install authority'
