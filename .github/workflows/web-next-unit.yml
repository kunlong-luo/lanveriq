name: Next.js isolated preview checks
on:
  push:
    paths:
      - 'apps/web-next/**'
      - '.github/workflows/web-next-unit.yml'
  pull_request:
    paths:
      - 'apps/web-next/**'
      - '.github/workflows/web-next-unit.yml'
permissions:
  contents: read
jobs:
  next-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pinned pnpm 12 and Node 24 (lockfile required)
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web-next
          install: true
          require-lockfile: true
          cache: false
      - name: Fail closed on dependency drift (frozen pnpm lockfile)
        working-directory: apps/web-next
        run: pnpm install --frozen-lockfile
      - name: Regress transitive source-level authentication isolation (NO runtime)
        working-directory: apps/web-next
        run: node --test scripts/test_runtime_isolation.mjs
      - name: Check no API proxy or reachable credential route
        working-directory: apps/web-next
        run: pnpm run verify:routes
      - name: Verify manual Chromium gate source only (NO browser or network)
        working-directory: apps/web-next
        run: |
          python3 -m py_compile scripts/verify-preview-chromium.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run synthetic-only Next.js component tests
        working-directory: apps/web-next
        run: pnpm test
      - name: Typecheck and build production Next.js candidate
        working-directory: apps/web-next
        run: |
          pnpm typecheck
          pnpm build
      - name: Smoke-test actual production Next.js preview HTTP routes
        working-directory: apps/web-next
        run: node scripts/verify-built-pages.mjs
      - name: Compile disposable auth-test App Router page only (NO runtime/browser/DB)
        working-directory: apps/web-next
        env:
          LANVERIQ_SYNTHETIC_BROWSER_PROBE: '1'
          LANVERIQ_SYNTHETIC_NEXTJS_PROBE: '1'
          LANVERIQ_SYNTHETIC_AUTH_UI_PROBE: '1'
          LANVERIQ_SYNTHETIC_MULTI_ADMIN_PROBE: '1'
        run: |
          set -euo pipefail
          # These flags are source-fixture prerequisites only. This automatic
          # CI step neither starts Spring/Caddy nor submits credentials.
          # The untouched ordinary preview was built and checked above.
          node scripts/install-synthetic-auth-fixture.mjs
          trap 'rm -rf src/app/synthetic-auth-probe src/app/synthetic-multi-admin-probe src/app/synthetic-console-candidate src/app/synthetic-console-route' EXIT
          pnpm typecheck
          pnpm build
