name: Server OpenAPI and cross-app contract acceptance (milestone, synthetic-only)

# Heavy type-generation/packaging checks are grouped at coherent
# milestones, not run for every Java or visual-component commit.
on:
  push:
    tags:
      - 'acceptance/v0.1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-contract-milestone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify official Gradle Wrapper
        working-directory: apps/server
        run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Build reviewed Java contracts and full PostgreSQL integration test sources
        working-directory: apps/server
        run: |
          ./gradlew test compileIntegrationTestJava bootJar
          python3 scripts/verify-generated-openapi.py build/contracts/openapi.json
      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: lanveriq-v01-milestone-openapi-${{ github.sha }}
          path: apps/server/build/contracts/openapi.json
          retention-days: 14
          if-no-files-found: error
      - name: Set up pnpm 12 and Node 24
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/server/contract-client-check
          install: true
          require-lockfile: true
          cache: false
      - name: Generate actual Orval client and check TypeScript
        working-directory: apps/server/contract-client-check
        run: pnpm verify
      - name: Verify generated React Query client against locked canonical Next.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web-next/.generated-contract/model
          cp -a apps/server/contract-client-check/generated/. apps/web-next/.generated-contract/
          cd apps/web-next
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --project tsconfig.contract.json
      - name: Upload generated typechecked client (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: lanveriq-v01-milestone-orval-${{ github.sha }}
          path: apps/server/contract-client-check/generated/
          if-no-files-found: error
          retention-days: 14
