name: Agent unit tests

on:
  push:
    paths:
      - 'apps/agent/**'
      - '.github/workflows/agent-unit.yml'
  pull_request:
    paths:
      - 'apps/agent/**'
      - '.github/workflows/agent-unit.yml'

permissions:
  contents: read

jobs:
  agent-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Verify committed Cargo dependency lock (no updates)
        shell: bash
        run: |
          test -f Cargo.lock
          cargo +1.94.0 metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Rustfmt
        run: cargo +1.94.0 fmt --all -- --check
      - name: Unit tests only (no OS/systemd/E2E)
        run: cargo +1.94.0 test --workspace --locked
      - name: Clippy static checks
        run: cargo +1.94.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Preserve committed Cargo.lock
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: agent-cargo-lockfile
          path: apps/agent/Cargo.lock
          retention-days: 7
