name: Agent unit tests

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/agent/**'
      - '.github/workflows/agent-unit.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/agent/**'
      - '.github/workflows/agent-unit.yml'

permissions:
  contents: read

jobs:
  agent-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Resolve Windows SCM dependency for review and lockfile update
        shell: bash
        run: |
          cargo +1.94.0 generate-lockfile
          echo 'LANVERIQ_LOCK_BEGIN'
          cat Cargo.lock
          echo 'LANVERIQ_LOCK_END'
      - name: Rustfmt
        run: cargo +1.94.0 fmt --all -- --check
      - name: Unit tests only (no OS/systemd/E2E)
        run: cargo +1.94.0 test --workspace --locked
      - name: Clippy static checks
        run: cargo +1.94.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Preserve generated lockfile for reviewed commit
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: agent-cargo-lockfile
          path: Cargo.lock
          retention-days: 7
