name: Console HTTPS Spring session (synthetic-only)

# Isolated synthetic-only suite: automatically execute all four browser/RBAC
# checks on reviewed MAIN changes affecting the security acceptance path.
# Manual dispatch remains available with default-OFF individual probes.
# No production secrets, real users, Agent collection or deployment.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/console-https-synthetic.yml'
      - 'apps/server/scripts/verify-synthetic-console-browser.py'
      - 'apps/server/scripts/verify-agent-upstream-tls.sh'
      - 'apps/server/scripts/verify-synthetic-console-session.sh'
      - 'apps/server/scripts/seed-synthetic-multi-admin.sql'
      - 'apps/server/src/main/java/com/lanveriq/server/security/**'
      - 'apps/server/src/main/java/com/lanveriq/server/devices/**'
      - 'apps/server/src/integrationTest/java/com/lanveriq/server/security/**'
      - 'apps/server/src/main/resources/db/migration/**'
      - 'apps/web-next/src/synthetic-only-auth-probe.tsx'
      - 'apps/web-next/src/synthetic-only-multi-admin-probe.tsx'
      - 'apps/web-next/src/staged-console-workspace.tsx'
      - 'apps/web-next/src/staged-console-route-boundary.tsx'
      - 'apps/web-next/src/lib/staged-console-overview.ts'
      - 'apps/web-next/src/components/device-directory.tsx'
      - 'apps/web-next/src/app/globals.css'
      - 'apps/web-next/scripts/verify-route-contract.mjs'
      - 'apps/web-next/scripts/verify-synthetic-nextjs-origin.py'
      - 'apps/web-next/scripts/verify-runtime-isolation.mjs'
      - 'apps/web-next/scripts/test_runtime_isolation.mjs'
      - 'apps/web-next/package.json'
      - 'apps/web-next/pnpm-lock.yaml'
      - 'apps/web-next/src/lib/staged-console-auth.ts'
      - 'apps/web-next/src/lib/staged-console-read.ts'
      - 'apps/web-next/src/lib/console-query-policy.ts'
      - 'apps/web-next/scripts/install-synthetic-auth-fixture.mjs'
  workflow_dispatch:
    inputs:
      browser_probe:
        description: 'Also check actual Chromium Cookie, Origin and CSRF (synthetic-only)'
        required: true
        type: boolean
        default: false
      nextjs_same_origin_probe:
        description: 'Also mount disposable Next.js preview under the same synthetic Console HTTPS origin (requires browser_probe=true)'
        required: true
        type: boolean
        default: false
      synthetic_auth_ui_probe:
        description: 'Build a disposable, test-only Next.js credentialed UI route (requires both browser and Next.js probes)'
        required: true
        type: boolean
        default: false
      synthetic_multi_admin_probe:
        description: 'Seed disposable two-group PG18 users/devices and check two Chromium sessions (requires all three other probes)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Push builds supersede stale push builds; manual opt-ins never cancel each
  # other. Distinct event types have separate concurrency groups.
  group: lanveriq-console-synthetic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  console-session-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      # Installed browser binaries must remain visible when the test switches
      # HOME to its disposable, CA-trusted NSS profile.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/lanveriq-playwright-browsers
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject combined browser/UI test without explicit Chromium opt-in
        if: ${{ inputs.nextjs_same_origin_probe && !inputs.browser_probe }}
        run: |
          echo "FAIL: same-origin Next.js test requires an explicitly enabled real Chromium probe"
          exit 1
      - name: Reject synthetic auth UI probe without both independent browser gates
        if: ${{ inputs.synthetic_auth_ui_probe && (!inputs.browser_probe || !inputs.nextjs_same_origin_probe) }}
        run: |
          echo "FAIL: synthetic-only Next.js auth UI requires both explicit browser and same-origin Next.js opt-ins"
          exit 1
      - name: Reject multi-admin browser probe without all earlier opt-in gates
        if: ${{ inputs.synthetic_multi_admin_probe && (!inputs.browser_probe || !inputs.nextjs_same_origin_probe || !inputs.synthetic_auth_ui_probe) }}
        run: |
          echo "FAIL: disposable multi-admin browser test requires all three previously gated probes"
          exit 1
      - name: Declare exact synthetic acceptance scope (request, not pass)
        env:
          MULTI_REQUESTED: ${{ (github.event_name == 'push' || inputs.synthetic_multi_admin_probe) && '1' || '0' }}
          BROWSER_REQUESTED: ${{ (github.event_name == 'push' || inputs.browser_probe) && '1' || '0' }}
          NEXTJS_REQUESTED: ${{ (github.event_name == 'push' || inputs.nextjs_same_origin_probe) && '1' || '0' }}
          AUTH_UI_REQUESTED: ${{ (github.event_name == 'push' || inputs.synthetic_auth_ui_probe) && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Lanveriq disposable Console acceptance"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Trigger: %s\n' "$GITHUB_EVENT_NAME"
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "Automatic path-filtered main-branch acceptance: all four disposable probes requested."
            fi
            echo "| Gate | Requested |"
            echo "| --- | --- |"
            echo "| Caddy → real Tomcat → PostgreSQL 18 HTTPS session | yes (always) |"
            if [[ "$BROWSER_REQUESTED" == 1 ]]; then
              echo "| Real Chromium: TLS/Host/Cookie/CSRF/Login | YES; result pending |"
            else
              echo "| Real Chromium: TLS/Host/Cookie/CSRF/Login | SKIPPED (browser_probe=false) |"
            fi
            if [[ "$NEXTJS_REQUESTED" == 1 ]]; then
              echo "| Next.js + Spring same-origin Chromium | YES; result pending |"
            else
              echo "| Next.js + Spring same-origin Chromium | SKIPPED (nextjs_same_origin_probe=false) |"
            fi
            if [[ "$AUTH_UI_REQUESTED" == 1 ]]; then
              echo "| Disposable Next.js credentialed browser fixture (not real login UI) | YES; result pending |"
            else
              echo "| Disposable Next.js credentialed browser fixture | SKIPPED (synthetic_auth_ui_probe=false) |"
            fi
            if [[ "$MULTI_REQUESTED" == 1 ]]; then
              echo "| Two-admin nonempty PG18 browser-session isolation | YES; result pending |"
            else
              echo "| Two-admin nonempty PG18 browser-session isolation | SKIPPED (synthetic_multi_admin_probe=false) |"
            fi
            echo ""
            echo "A green workflow only proves the requested gates. Unselected gates are not accepted."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up pinned Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure official Gradle wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Record synthetic-only run provenance (no credentials)
        run: |
          printf 'Tested Git SHA: %s\n' "$GITHUB_SHA"
          java -version
          docker info --format 'Docker server {{.ServerVersion}}'
          openssl version
          curl --version | head -n 1
          script --version
      - name: Prove Caddy image CLI exists without network listeners
        run: docker run --rm --network none caddy:2.11.7 caddy version
      - name: Syntax-check both real TLS and synthetic console scripts
        run: |
          bash -n apps/server/scripts/verify-agent-upstream-tls.sh
          bash -n apps/server/scripts/verify-synthetic-console-session.sh
      - name: Assert real Boot-discovered Console SecurityFilterChains on disposable PG18
        # Opt-in manual workflow only: Testcontainers launches an isolated
        # PostgreSQL 18.6, boots the actual application with an in-process
        # MockMvc servlet stack and checks auth/CSRF/readonly deny semantics.
        # This intentionally catches @WebMvcTest's manual-@Import blind spot.
        # No exposed listener, real administrator, Agent or device collection.
        working-directory: apps/server
        run: ./gradlew integrationTest --tests 'com.lanveriq.server.security.PostgreSqlConsoleSecurityWiringIT'
      - name: Install isolated pinned Playwright/Chromium only for explicit browser opt-in
        if: ${{ github.event_name == 'push' || inputs.browser_probe }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lanveriq-playwright"
          "$RUNNER_TEMP/lanveriq-playwright/bin/python" -m pip install --disable-pip-version-check 'playwright==1.64.1'
          "$RUNNER_TEMP/lanveriq-playwright/bin/python" -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3-tools
      - name: Set up locked Node 24/pnpm 12 only for explicit same-origin Next.js test
        if: ${{ github.event_name == 'push' || inputs.nextjs_same_origin_probe }}
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web-next
          install: true
          require-lockfile: true
          cache: false
      - name: Build default disabled-login preview (optionally add disposable auth fixture)
        if: ${{ github.event_name == 'push' || inputs.nextjs_same_origin_probe }}
        working-directory: apps/web-next
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          LANVERIQ_SYNTHETIC_BROWSER_PROBE: ${{ (github.event_name == 'push' || inputs.browser_probe) && '1' || '0' }}
          LANVERIQ_SYNTHETIC_NEXTJS_PROBE: ${{ (github.event_name == 'push' || inputs.nextjs_same_origin_probe) && '1' || '0' }}
          LANVERIQ_SYNTHETIC_AUTH_UI_PROBE: ${{ (github.event_name == 'push' || inputs.synthetic_auth_ui_probe) && '1' || '0' }}
          LANVERIQ_SYNTHETIC_MULTI_ADMIN_PROBE: ${{ (github.event_name == 'push' || inputs.synthetic_multi_admin_probe) && '1' || '0' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # Must run before inserting the test-only App Router page. The
          # committed preview must never expose a credential-bearing route.
          pnpm run verify:routes
          pnpm test
          if [[ "$LANVERIQ_SYNTHETIC_AUTH_UI_PROBE" == 1 ]]; then
            node scripts/install-synthetic-auth-fixture.mjs
          fi
          pnpm typecheck
          pnpm build
      - name: Run isolated Caddy->Tomcat->PG18 HTTPS session and negative checks
        env:
          LANVERIQ_SYNTHETIC_CADDY_BRIDGE: '1'
          LANVERIQ_SYNTHETIC_CONSOLE_SESSION: '1'
          LANVERIQ_SYNTHETIC_BROWSER_PROBE: ${{ (github.event_name == 'push' || inputs.browser_probe) && '1' || '0' }}
          LANVERIQ_SYNTHETIC_NEXTJS_PROBE: ${{ (github.event_name == 'push' || inputs.nextjs_same_origin_probe) && '1' || '0' }}
          LANVERIQ_SYNTHETIC_AUTH_UI_PROBE: ${{ (github.event_name == 'push' || inputs.synthetic_auth_ui_probe) && '1' || '0' }}
          LANVERIQ_SYNTHETIC_MULTI_ADMIN_PROBE: ${{ (github.event_name == 'push' || inputs.synthetic_multi_admin_probe) && '1' || '0' }}
          LANVERIQ_BROWSER_PYTHON: ${{ runner.temp }}/lanveriq-playwright/bin/python
          NEXT_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LANVERIQ_SYNTHETIC_NEXTJS_PROBE" == 1 ]]; then
            [[ "$LANVERIQ_SYNTHETIC_BROWSER_PROBE" == 1 ]] || {
              echo "FAIL: same-origin Next.js must require real Chromium opt-in"
              exit 1
            }
            if (echo > /dev/tcp/127.0.0.1/3100) >/dev/null 2>&1; then
              echo "FAIL: synthetic Next.js port already occupied"
              exit 1
            fi
            # The only two holders of this ephemeral proof are the local
            # Next process and Caddy's disposable, separately authorized
            # upstream. No production secret, GitHub credential or account
            # identifier is used. Never emit its value to Actions logs.
            umask 077
            export LANVERIQ_SYNTHETIC_EDGE_SECRET
            LANVERIQ_SYNTHETIC_EDGE_SECRET="$(openssl rand -hex 32)"
            [[ "$LANVERIQ_SYNTHETIC_EDGE_SECRET" =~ ^[a-f0-9]{64}$ ]] || exit 1
            (
              cd apps/web-next
              pnpm exec next start --hostname 127.0.0.1 --port 3100
            ) > "$RUNNER_TEMP/lanveriq-nextjs-synthetic.log" 2>&1 &
            next_pid=$!
            trap 'kill "$next_pid" >/dev/null 2>&1 || true; wait "$next_pid" >/dev/null 2>&1 || true' EXIT
            ready=0
            for _ in $(seq 1 80); do
              kill -0 "$next_pid" >/dev/null 2>&1 || {
                echo "FAIL: isolated Next.js preview exited before TLS test"
                exit 1
              }
              status="$(curl --silent --noproxy '*' --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/overview || true)"
              if [[ "$status" == 200 ]]; then ready=1; break; fi
              sleep 0.5
            done
            [[ "$ready" == 1 ]] || { echo "FAIL: isolated Next.js did not become ready"; exit 1; }
            # Direct loopback and non-loopback TCP negatives MUST run before
            # Caddy starts: no browser business session may be created here.
            python3 apps/web-next/scripts/verify-synthetic-nextjs-origin.py
          fi
          bash apps/server/scripts/verify-agent-upstream-tls.sh
          {
            echo "### Verified result"
            echo "- PASS: real Caddy/Tomcat/PostgreSQL 18 backend HTTPS session and negative checks"
            if [[ "$LANVERIQ_SYNTHETIC_BROWSER_PROBE" == 1 ]]; then
              echo "- PASS: real Chromium Console security, synthetic login and session checks"
            else
              echo "- SKIPPED: real Chromium Console security (browser_probe=false)"
            fi
            if [[ "$LANVERIQ_SYNTHETIC_NEXTJS_PROBE" == 1 ]]; then
              echo "- PASS: real Next.js preview + Spring same-origin Chromium checks (default /login stays disabled)"
            else
              echo "- SKIPPED: Next.js + Spring same-origin Chromium (nextjs_same_origin_probe=false)"
            fi
            if [[ "$LANVERIQ_SYNTHETIC_AUTH_UI_PROBE" == 1 ]]; then
              echo "- PASS: disposable Next.js credentialed synthetic browser UI fixture (real browser login, authorized empty reads, logout)"
            else
              echo "- SKIPPED: disposable Next.js auth UI fixture (synthetic_auth_ui_probe=false)"
            fi
            if [[ "$LANVERIQ_SYNTHETIC_MULTI_ADMIN_PROBE" == 1 ]]; then
              echo "- PASS: disposable nonempty PG18 two-admin Chromium contexts, scope denial, cookie separation and cache invalidation"
            else
              echo "- SKIPPED: nonempty PG18 two-admin browser scope probe (synthetic_multi_admin_probe=false)"
            fi
            echo "- PASS: nonempty two-group Servlet/DB RBAC checks using synthetic authenticated principals on actual PG18 (separate earlier integrationTest step)"
            echo "- NOT PROVEN: production Next.js /login or live data hooks, real users/devices/Agent, human UX review or deployment"
          } >> "$GITHUB_STEP_SUMMARY"
