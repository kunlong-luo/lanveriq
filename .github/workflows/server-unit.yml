name: Server unit tests

on:
  push:
    paths:
      - 'apps/server/**'
      - 'apps/web/contract-check/**'
      - 'apps/web/tsconfig.contract.json'
      - 'apps/web/package.json'
      - 'apps/web/pnpm-lock.yaml'
      - 'apps/web-next/contract-check/**'
      - 'apps/web-next/tsconfig.contract.json'
      - 'apps/web-next/src/lib/console-device-projection.ts'
      - 'apps/web-next/src/components/device-directory.tsx'
      - 'apps/web-next/package.json'
      - 'apps/web-next/pnpm-lock.yaml'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'apps/web/contract-check/**'
      - 'apps/web/tsconfig.contract.json'
      - 'apps/web/package.json'
      - 'apps/web/pnpm-lock.yaml'
      - 'apps/web-next/contract-check/**'
      - 'apps/web-next/tsconfig.contract.json'
      - 'apps/web-next/src/lib/console-device-projection.ts'
      - 'apps/web-next/src/components/device-directory.tsx'
      - 'apps/web-next/package.json'
      - 'apps/web-next/pnpm-lock.yaml'
      - '.github/workflows/server-unit.yml'

permissions:
  contents: read

jobs:
  server-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify localhost smoke probe (synthetic-only, no database)
        run: |
          bash -n apps/server/scripts/verify-local-server.sh
          python3 -m unittest discover -s apps/server/scripts -p 'test_verify_local_server.py'
      - name: Syntax-check the manual PostgreSQL setup helper (do not execute)
        run: bash -n apps/server/scripts/setup-local-postgres.sh
      - name: Check manual SQL bootstrap portability and safety (no DB or Docker)
        run: python3 -m unittest discover -s apps/server/scripts -p 'test_provision_lanveriq_database.py'
      - name: Validate manual PostgreSQL script syntax (do not execute integration)
        run: bash -n apps/server/scripts/verify-postgres18.sh
      - name: Validate manual Spring upstream TLS script syntax (no TLS/Docker execution)
        run: bash -n apps/server/scripts/verify-agent-upstream-tls.sh
      - name: Verify official Gradle Wrapper binary
        working-directory: apps/server
        run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Unit-test the manual PostgreSQL evidence checker (synthetic XML only)
        run: python3 -m unittest discover -s apps/server/scripts -p 'test_assert_postgres18_junit.py'
      - name: Unit-test Springdoc contract validator (invented JSON, no DB)
        run: python3 -m unittest discover -s apps/server/scripts -p 'test_verify_generated_openapi.py'
      - name: Run real unit tests (no integration/E2E)
        working-directory: apps/server
        run: ./gradlew test
      - name: Verify REAL Springdoc-generated device contract (no DB, Docker or TLS)
        working-directory: apps/server
        run: python3 scripts/verify-generated-openapi.py build/contracts/openapi.json
      - name: Publish reviewed source-generated OpenAPI as CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: lanveriq-device-openapi-${{ github.sha }}
          path: apps/server/build/contracts/openapi.json
          if-no-files-found: error
          retention-days: 14
      - name: Compile opt-in PostgreSQL integration source (do not start Docker)
        working-directory: apps/server
        # A previous Gradle cache contained negative Maven Central JAR lookups.
        # Force a genuine dependency re-resolution; this still FAILS on errors.
        run: ./gradlew --refresh-dependencies compileIntegrationTestJava
      - name: Verify runnable Boot JAR packaging (no integration/E2E)
        working-directory: apps/server
        run: ./gradlew bootJar
      # Node/pnpm is used ONLY for typed API contract verification; no UI
      # app is deployed, and PostgreSQL/manual TLS gates stay independent.
      - name: Set up pnpm and Node 24 for Orval contract smoke
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/server/contract-client-check
          install: true
          require-lockfile: true
          cache: false
      - name: Generate and typecheck actual Orval Fetch/TanStack Query client
        working-directory: apps/server/contract-client-check
        run: pnpm verify
      # This is a build-only integration between the Java-produced OpenAPI
      # and the ACTUAL apps/web React Query / TypeScript dependency graph.
      # Nothing is fetched or authenticated in a browser. The generated
      # sources are never hand-edited or checked in as a stale copy.
      - name: Verify Orval output against the actual Web TS/React Query environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/.generated-contract
          cp -a apps/server/contract-client-check/generated/. apps/web/.generated-contract/
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --project tsconfig.contract.json
      - name: Verify actual generated Springdoc/Orval models against Next.js display projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web-next/.generated-contract/model
          cp -a apps/server/contract-client-check/generated/. apps/web-next/.generated-contract/
          cd apps/web-next
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --project tsconfig.contract.json
      - name: Upload non-deployed typechecked Orval candidate
        uses: actions/upload-artifact@v7
        with:
          name: lanveriq-orval-contract-${{ github.sha }}
          path: apps/server/contract-client-check/generated/
          if-no-files-found: error
          retention-days: 14
