name: Server unit tests

# Fast, path-scoped L1 source and security-negative unit feedback only.
# The expensive OpenAPI/Orval/PG-source/Boot packaging gate moved to
# server-contract-milestone.yml, automatic only for acceptance/v0.1-* tags.
on:
  push:
    paths:
      - 'apps/server/**'
      - 'deploy/caddy/Caddyfile.reference'
      - 'deploy/caddy/tests/**'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'deploy/caddy/Caddyfile.reference'
      - 'deploy/caddy/tests/**'
      - '.github/workflows/server-unit.yml'

concurrency:
  group: lanveriq-server-unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify localhost smoke probe (synthetic-only, no database)
        run: |
          bash -n apps/server/scripts/verify-local-server.sh
          python3 -m unittest discover -s apps/server/scripts -p 'test_verify_local_server.py'
      - name: Syntax-check the manual PostgreSQL setup helper (do not execute)
        run: bash -n apps/server/scripts/setup-local-postgres.sh
      - name: Check manual SQL bootstrap portability and safety (no DB or Docker)
        run: python3 -m unittest discover -s apps/server/scripts -p 'test_provision_lanveriq_database.py'
      - name: Validate manual PostgreSQL script syntax (do not execute integration)
        run: bash -n apps/server/scripts/verify-postgres18.sh
      - name: Validate manual Spring upstream TLS script syntax (no TLS/Docker execution)
        run: bash -n apps/server/scripts/verify-agent-upstream-tls.sh
      - name: Verify Caddy Docker command prefix (source regression only, no Docker/TLS)
        run: python3 -m unittest discover -s deploy/caddy/tests -p 'test_*.py'
      - name: Syntax-check manual Caddy mTLS acceptance harness only (no Docker or TLS)
        run: |
          bash -n deploy/caddy/tests/verify-reference.sh
          bash -n apps/server/scripts/verify-synthetic-console-session.sh
          python3 -m py_compile deploy/caddy/tests/synthetic-mtls-backend.py
      - name: Verify official Gradle Wrapper binary
        working-directory: apps/server
        run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Unit-test the manual PostgreSQL evidence checker (synthetic XML only)
        run: python3 -m unittest discover -s apps/server/scripts -p 'test_assert_postgres18_junit.py'
      - name: Unit-test Springdoc contract validator (invented JSON, no DB)
        run: python3 -m unittest discover -s apps/server/scripts -p 'test_verify_generated_openapi.py'
      - name: Run real unit tests (no integration/E2E)
        working-directory: apps/server
        run: ./gradlew test
