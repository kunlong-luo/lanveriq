name: Desktop GPUI candidate dependency resolution and compile (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/gpui-candidate/**'
      - '.github/workflows/desktop-gpui-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop/gpui-candidate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Verify candidate has no product or privileged interfaces
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          p = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          assert p["package"]["publish"] is False
          assert set(p["dependencies"]) == {"gpui-kit"}
          d = p["dependencies"]["gpui-kit"]
          assert d["version"] == "=0.11.0" and d["default-features"] is False
          assert set(d["features"]) == {"component", "assets", "x11"}
          assert not pathlib.Path("build.rs").exists()
          for path in pathlib.Path("src").rglob("*.rs"):
              data = path.read_text()
              for token in ("std::net", "unsafe {", "reqwest::", "zbus::", "tokio::", "include_bytes!", "include_str!", "OpenOptions", "File::create", "std::io::Write"):
                  assert token not in data, (path, token)
              if path == pathlib.Path("src/host_identity.rs"):
                  assert data.count("std::fs") == 1 and "std::fs::File::open(path)" in data
                  assert '"/proc/self/status"' in data and '"/etc/os-release"' in data
                  assert "file.take(16_385)" in data and "ordinary_user" in data
              elif path == pathlib.Path("src/runtime_metadata.rs"):
                  assert data.count("std::process") == 1 and data.count("Command::new") == 1
                  assert 'Command::new("/usr/bin/timeout")' in data
                  assert '"/usr/bin/dpkg-query"' in data and '"/usr/bin/systemctl"' in data
                  assert '"--kill-after=1s", "3s"' in data and "out.take(4097)" in data
                  assert ".env_clear()" in data and ".stderr(Stdio::null())" in data
                  assert data.count("std::fs") == 1 and 'std::fs::symlink_metadata("/usr/local/bin/lanveriq-agent")' in data
                  assert not any(t in data for t in ('"/bin/sh"', '"/bin/bash"', '"sudo"', '"start"', '"stop"', '"enable"', '"install"', '"daemon-reload"'))
              else:
                  assert "std::fs" not in data, path
              if path != pathlib.Path("src/runtime_metadata.rs"):
                  assert "std::process" not in data and "Command::new" not in data and "std::env" not in data, path
              else:
                  assert data.count("std::env") == 3
                  for name in ("XDG_CURRENT_DESKTOP", "XDG_SESSION_TYPE", "WAYLAND_DISPLAY"):
                      assert f'std::env::var("{name}")' in data
          assert ".disabled(true)" in pathlib.Path("src/main.rs").read_text()
          PY
      - name: Require committed candidate lock and exact digest (not product approval)
        run: |
          git ls-files --error-unmatch Cargo.lock
          sha256sum --check --strict Cargo.lock.sha256
          cargo +1.100.0 metadata --locked --format-version 1 > candidate-metadata.json
          python3 - <<'PY'
          import json
          pkgs = json.load(open("candidate-metadata.json"))["packages"]
          for name, version in (("gpui-kit", "0.11.0"), ("gpui-pre", "0.3.14"), ("gpui-pre-platform", "0.3.14")):
              assert [p["version"] for p in pkgs if p["name"] == name] == [version], name
          assert all(p["source"] == "registry+https://github.com/rust-lang/crates.io-index" or (p["source"] is None and p["name"] == "lanveriq-desktop-gpui-candidate") for p in pkgs)
          import pathlib, re, tomllib
          locked = tomllib.loads(pathlib.Path("Cargo.lock").read_text())["package"]
          assert len(locked) == 813
          assert len([p for p in locked if "source" not in p]) == 1
          assert all(p.get("source") == "registry+https://github.com/rust-lang/crates.io-index" and re.fullmatch(r"[0-9a-f]{64}", p.get("checksum", "")) for p in locked if "source" in p)
          with open("candidate-licenses.tsv", "w") as f:
              for p in sorted(pkgs, key=lambda p: (p["name"], p["version"])):
                  f.write("\t".join((p["name"], p["version"], p["license"] or "UNREVIEWED")) + "\n")
          PY
      - name: Archive lock and license inventory for review (no binaries)
        uses: actions/upload-artifact@v4
        with:
          name: gpui-candidate-resolution
          path: |
            apps/desktop/gpui-candidate/Cargo.lock
            apps/desktop/gpui-candidate/candidate-licenses.tsv
          retention-days: 7
      - name: Record actual Linux normal and build dependency and feature graph
        run: |
          cargo +1.100.0 tree --locked --target x86_64-unknown-linux-gnu -e normal,build --prefix none --format '{p}' > candidate-linux-packages.txt
          cargo +1.100.0 tree --locked --target x86_64-unknown-linux-gnu -e features > candidate-linux-features.txt
          python3 - <<'PY'
          import pathlib
          names = {line.split()[0] for line in pathlib.Path("candidate-linux-packages.txt").read_text().splitlines() if line.strip()}
          assert {"gpui-kit", "gpui-pre", "gpui-pre-linux", "gpui-pre-platform"} <= names
          forbidden = sorted(name for name in names if name.startswith(("gpui-fast", "gpui-kit-shell", "gpui-kit-webview", "webkit", "speech-dispatcher")))
          assert not forbidden, forbidden
          PY
      - name: Install disposable runner upstream development prerequisites
        run: |
          sudo apt-get -o APT::Get::AllowUnauthenticated=false update
          sudo apt-get -o APT::Get::AllowUnauthenticated=false install -y --no-install-recommends \
            gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libdbus-1-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1
      - name: Test offline model and build candidate (no GUI execution or install)
        run: |
          cargo +1.100.0 test --locked --lib
          test "$(id -u)" -ne 0
          cargo +1.100.0 test --locked --lib host_identity::tests::live_ubuntu_identity_only -- --ignored --exact
          cargo +1.100.0 test --locked --lib runtime_metadata::tests::live_ubuntu_runtime_readonly -- --ignored --exact
          cargo +1.100.0 build --locked --message-format=json-render-diagnostics > candidate-build.jsonl
          python3 - <<'PY'
          import json, pathlib, subprocess, re
          messages = [json.loads(line) for line in pathlib.Path("candidate-build.jsonl").read_text().splitlines()]
          binaries = [m["executable"] for m in messages if m.get("reason") == "compiler-artifact" and m.get("executable") and m.get("target", {}).get("name") == "lanveriq-desktop-gpui-candidate" and "bin" in m["target"]["kind"]]
          assert len(binaries) == 1, binaries
          binary = pathlib.Path(binaries[0])
          assert binary.is_file()
          dynamic = subprocess.check_output(["readelf", "-d", str(binary)], text=True)
          needed = set(re.findall(r"\(NEEDED\).*\[([^\]]+)\]", dynamic))
          expected = {"libxcb.so.1", "libxkbcommon.so.0", "libxkbcommon-x11.so.0", "libgcc_s.so.1", "libm.so.6", "libc.so.6", "ld-linux-x86-64.so.2"}
          assert needed == expected, (needed, expected)
          with open("candidate-linux-elf.txt", "w") as f:
              f.write(f"ELF bytes (debug profile, not package size): {binary.stat().st_size}\n")
              f.flush()
              f.write(dynamic)
          PY
          sha256sum --check --strict Cargo.lock.sha256
      - name: Install disposable X11 software-rendered window test tools
        run: |
          sudo apt-get -o APT::Get::AllowUnauthenticated=false install -y --no-install-recommends \
            xvfb xauth openbox xdotool x11-utils mesa-vulkan-drivers libgl1-mesa-dri \
            dbus-x11 fonts-noto-cjk imagemagick
      - name: Run actual native window on isolated virtual X11 display (nonrelease)
        run: |
          set -o pipefail
          timeout --kill-after=5s 100s xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp" \
            dbus-run-session -- python3 tools/window_smoke.py | tee candidate-window-smoke.txt
      - name: Archive synthetic window smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-candidate-window-smoke
          path: apps/desktop/gpui-candidate/candidate-window-smoke.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive Linux graph and direct ELF dependency evidence (no binaries)
        uses: actions/upload-artifact@v4
        with:
          name: gpui-candidate-linux-evidence
          path: |
            apps/desktop/gpui-candidate/candidate-linux-packages.txt
            apps/desktop/gpui-candidate/candidate-linux-features.txt
            apps/desktop/gpui-candidate/candidate-linux-elf.txt
          if-no-files-found: error
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/gpui-candidate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Require exact candidate resolution before auditing
        run: |
          git ls-files --error-unmatch Cargo.lock
          sha256sum --check --strict Cargo.lock.sha256
      - name: Install pinned RustSec auditor (CI only)
        run: |
          cargo +1.100.0 install --locked --version '=0.23.0' cargo-audit
          cargo +1.100.0 audit --version
      - name: Audit candidate lock against RustSec (no ignores)
        run: |
          set +e
          cargo +1.100.0 audit --json > candidate-rustsec.json
          audit_status=$?
          set -e
          printf 'cargo-audit exit status: %s\n' "$audit_status" > candidate-rustsec-provenance.txt
          cargo +1.100.0 audit --version >> candidate-rustsec-provenance.txt
          sha256sum Cargo.lock >> candidate-rustsec-provenance.txt
          if [ -d "${CARGO_HOME:-$HOME/.cargo}/advisory-db" ]; then
            git -C "${CARGO_HOME:-$HOME/.cargo}/advisory-db" rev-parse HEAD >> candidate-rustsec-provenance.txt
          fi
          test -s candidate-rustsec.json
          python3 -m json.tool candidate-rustsec.json > /dev/null
          sha256sum --check --strict Cargo.lock.sha256
          exit "$audit_status"
      - name: Archive audit report, including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-candidate-rustsec
          path: |
            apps/desktop/gpui-candidate/candidate-rustsec.json
            apps/desktop/gpui-candidate/candidate-rustsec-provenance.txt
          retention-days: 7
