name: NXT-15 temporary Base UI dependency lock synchronization

# One-off manifest-only maintenance: auto-generate an exact pnpm lockfile.
# No production services, API credentials, device collection or deployment.
# DELETE this write-enabled workflow immediately after green verification.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web-next/package.json'

permissions:
  contents: write

concurrency:
  group: lanveriq-nxt15-component-lock-main
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Pin Node 24 and pnpm 12
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web-next
          install: false
          cache: false
      - name: Generate and validate reviewed Base UI dependency graph
        working-directory: apps/web-next
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json");if(p.dependencies["@base-ui/react"]!=="1.9.0"||p.dependencies.next!=="16.4.5")process.exit(1)'
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run verify:routes
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Commit only the exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/web-next/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Exact pnpm lockfile already synchronized.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock reviewed Base UI 1.9.0 component dependency tree'
          git push origin HEAD:main
