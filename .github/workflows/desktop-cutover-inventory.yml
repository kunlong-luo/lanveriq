name: Desktop source cutover inventory (read-only, nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'tools/desktop_cutover_inventory.py'
      - '.github/workflows/desktop-cutover-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enumerate tracked paths and affected references without changing source
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          sys.dont_write_bytecode = True
          import desktop_cutover_inventory as i
          assert i.REFERENCE.search("apps/desktop/gpui-candidate/Cargo.toml")
          assert i.REFERENCE.search("verify_desktop_readonly.py")
          assert i.LINK.findall("[test](../apps/desktop/src-tauri/Cargo.toml)") == ["../apps/desktop/src-tauri/Cargo.toml"]
          assert i.CANDIDATE + "Cargo.toml" in i.tracked()
          PY
          python3 tools/desktop_cutover_inventory.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
