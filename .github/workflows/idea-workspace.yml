name: IDEA root Gradle workspace model (synthetic-only)

on:
  push:
    paths:
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - 'apps/server/settings.gradle'
      - 'apps/server/gradle/wrapper/**'
      - 'docs/development/intellij-idea.md'
      - '.github/workflows/idea-workspace.yml'
  pull_request:
    paths:
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - 'apps/server/settings.gradle'
      - 'apps/server/gradle/wrapper/**'
      - '.github/workflows/idea-workspace.yml'

permissions:
  contents: read

jobs:
  root-gradle-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Reject drift between root and independently runnable backend Wrapper
        shell: bash
        run: |
          set -euo pipefail
          for file in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            cmp -- "$file" "apps/server/$file"
          done
          echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Confirm root Gradle composite loads without a database
        shell: bash
        run: ./gradlew --no-daemon --console=plain projects
      - name: Compile Java from included server build (no application startup)
        shell: bash
        run: ./gradlew --no-daemon --console=plain :lanveriq-server:compileJava
