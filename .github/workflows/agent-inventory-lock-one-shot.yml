name: Resolve inventory Cargo.lock (temporary, path-scoped)

# TEMPORARY dependency-maintenance workflow, not a release or deploy job.
# It runs only when the maintainer changes the Agent dependency manifest.
# It must be removed after the lockfile is generated and CI is green.
on:
  push:
    branches: [main]
    paths:
      - apps/agent/Cargo.toml

permissions:
  contents: write

concurrency:
  group: lanveriq-inventory-lock-resolve
  cancel-in-progress: false

jobs:
  resolve-lock-with-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install repository pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
          cargo --version
      - name: Resolve exact declared dependencies with official Cargo
        run: |
          cargo metadata --format-version 1 --manifest-path apps/agent/Cargo.toml > /dev/null
          test -f Cargo.lock
          git diff --check -- Cargo.lock
          git status --short
      - name: Commit only Cargo-generated lockfile
        env:
          BRANCH: main
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Cargo.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "build(agent): lock reviewed inventory crates via official Cargo resolver"
          git push origin "HEAD:${BRANCH}"
