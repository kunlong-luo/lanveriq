name: RustDesk OSS isolated server smoke

on:
  pull_request:
    paths:
      - "deploy/rustdesk-synthetic/**"
      - ".github/workflows/rustdesk-server-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-oss-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hbbs-hbbr-startup:
    name: Pinned hbbs/hbbr in Docker --network none
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch pinned official RustDesk OSS server release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rustdesk-zip" "$RUNNER_TEMP/rustdesk-extracted" "$RUNNER_TEMP/rustdesk-bin"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --max-time 120 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rustdesk/rustdesk-server/releases/download/1.1.16/rustdesk-server-linux-amd64.zip" \
            --output "$RUNNER_TEMP/rustdesk-zip/rustdesk-server-linux-amd64.zip"
          printf '%s  %s\n' \
            '0565c41affe6c3f409b0bddfaf5a24ccbf3f64f5f8e3fec250b69a0d5f6bdbcf' \
            "$RUNNER_TEMP/rustdesk-zip/rustdesk-server-linux-amd64.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/rustdesk-zip/rustdesk-server-linux-amd64.zip" \
            -d "$RUNNER_TEMP/rustdesk-extracted"
          HBBS="$(find "$RUNNER_TEMP/rustdesk-extracted" -type f -name hbbs -print -quit)"
          HBBR="$(find "$RUNNER_TEMP/rustdesk-extracted" -type f -name hbbr -print -quit)"
          test -n "$HBBS" && test -n "$HBBR"
          install -m 0755 "$HBBS" "$RUNNER_TEMP/rustdesk-bin/hbbs"
          install -m 0755 "$HBBR" "$RUNNER_TEMP/rustdesk-bin/hbbr"
          file "$RUNNER_TEMP/rustdesk-bin/hbbs" "$RUNNER_TEMP/rustdesk-bin/hbbr"

      - name: Run completely network-isolated service smoke
        shell: bash
        run: |
          set -euo pipefail
          # No forwarded ports, outbound networking, real agents, secrets,
          # shared host sockets, privileged runtime, or production CA.
          # The unmodified official binaries remain outside Lanveriq source.
          docker run --rm --pull=always \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --volume "$RUNNER_TEMP/rustdesk-bin:/opt/rustdesk:ro" \
            --volume "$GITHUB_WORKSPACE/deploy/rustdesk-synthetic/smoke.py:/workspace/smoke.py:ro" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            python:3.13-slim \
            python /workspace/smoke.py

      - name: Scope statement
        if: success()
        run: |
          echo "PASS only proves offline start/port/key-file/restart basics for RustDesk Server OSS 1.1.16."
          echo "Not yet tested: RustDesk client handshake, key rejection, NAT/P2P, relay sessions, Lanveriq RBAC or production security."
