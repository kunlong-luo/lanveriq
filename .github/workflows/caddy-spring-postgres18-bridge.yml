name: Caddy to real Spring Tomcat mTLS bridge (manual, synthetic-only)

# Explicit manual acceptance only. The app remains default deny, and all
# short-lived CA keys and PostgreSQL 18 data are confined to the runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-manual-caddy-spring-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-caddy-spring-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install approved Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure official Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Record exact synthetic test provenance
        run: |
          printf 'Tested Git SHA: %s\n' "$GITHUB_SHA"
          docker info --format 'Docker server {{.ServerVersion}}'
          openssl version
          curl --version | head -n 1
          java -version
          keytool -help >/dev/null
      - name: Validate manual TLS fixture syntax without execution
        run: bash -n apps/server/scripts/verify-agent-upstream-tls.sh
      - name: Run real Caddy to Spring/Tomcat two-way mTLS and PG18 checks
        env:
          LANVERIQ_SYNTHETIC_CADDY_BRIDGE: '1'
        run: bash apps/server/scripts/verify-agent-upstream-tls.sh
