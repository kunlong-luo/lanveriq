name: One-time Web pnpm lockfile bootstrap (synthetic-only)

# This temporary workflow only pins already-built synthetic UI dependencies.
# No backend, database, Agent, production secret or employee data involved.
# Remove the workflow after the lockfile is committed and frozen CI passes.
on:
  push:
    paths:
      - '.github/workflows/web-pin-lock-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-web-lock-pin
  cancel-in-progress: false

jobs:
  pin-reviewed-lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout only main for the reviewed bootstrap
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install exact pnpm 12 + Node 24 and create lockfile
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web
          install: true
          require-lockfile: false
          cache: false
      - name: Test synthetic UI without backend or Docker
        working-directory: apps/web
        run: pnpm test
      - name: Verify TypeScript and build preview
        working-directory: apps/web
        run: pnpm build
      - name: Commit only generated pnpm lockfile (no force)
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/pnpm-lock.yaml
          git add -- apps/web/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already committed; nothing to do.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = 'apps/web/pnpm-lock.yaml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(web): pin pnpm 12 dependency graph'
          git push origin HEAD:main
