name: Windows CNG non-exportable P-256 CSR (isolated synthetic L2)

# Windows-only isolated acceptance; uses a disposable current-user native
# CNG Software KSP key and deletes it after CSR signature verification.
# No Agent service install, Windows machine/service key, CA signing, mTLS,
# network enrollment, authorized real endpoint or telemetry.
on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/tools/windows/verify-cng-csr.ps1'
      - 'apps/agent/tools/windows/verify-cng-key-acl.ps1'
      - 'apps/agent/tools/windows/verify-cng-tls13-memory.ps1'
      - 'apps/agent/tools/windows/rustls-cng-probe/**'
      - '.github/workflows/agent-windows-cng-csr-synthetic.yml'
      - 'apps/server/src/test/java/com/lanveriq/server/enrollment/WindowsCngCsrInteropTest.java'
      - 'apps/server/src/main/java/com/lanveriq/server/enrollment/CertificateSigningRequestValidator.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-cng-csr-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cng-csr-synthetic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate disposable non-exportable CNG signing key and inspect real key DACL
        shell: pwsh
        env:
          SYNTHETIC_CSR_PATH: ${{ runner.temp }}\\lanveriq-cng-synthetic.csr.pem
        run: |
          ./apps/agent/tools/windows/verify-cng-csr.ps1 -PublicCsrPath $env:SYNTHETIC_CSR_PATH -ProbeKeyAcl
      - name: Confirm public CSR only, no private-key materials on disk
        shell: pwsh
        env:
          SYNTHETIC_CSR_PATH: ${{ runner.temp }}\\lanveriq-cng-synthetic.csr.pem
        run: |
          $pem = [IO.File]::ReadAllText($env:SYNTHETIC_CSR_PATH)
          if ($pem -notmatch '-----BEGIN CERTIFICATE REQUEST-----' -or
              $pem -match 'PRIVATE KEY|SECRET|ENROLLMENT TOKEN') {
            throw 'Public CSR artifact is malformed or contains a secret'
          }
          Write-Output 'PASS: the only cross-platform artifact will be the public CSR.'
      - name: Publish public-only synthetic CSR for independent Java validation
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-windows-cng-public-csr
          path: ${{ runner.temp }}/lanveriq-cng-synthetic.csr.pem
          if-no-files-found: error
          retention-days: 1
      - name: Erase the public CSR from the disposable Windows runner
        if: always()
        shell: pwsh
        env:
          SYNTHETIC_CSR_PATH: ${{ runner.temp }}\\lanveriq-cng-synthetic.csr.pem
        run: |
          if (Test-Path -LiteralPath $env:SYNTHETIC_CSR_PATH) {
            Remove-Item -LiteralPath $env:SYNTHETIC_CSR_PATH -Force
          }

  verify-spring-bouncycastle-interop:
    needs: cng-csr-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download public CSR only (no CNG private key)
        uses: actions/download-artifact@v4
        with:
          name: synthetic-windows-cng-public-csr
          path: ${{ runner.temp }}/cng-csr
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify native CNG P-256 PKCS10 with Java Bouncy Castle
        working-directory: apps/server
        env:
          LANVERIQ_SYNTHETIC_CNG_CSR: ${{ runner.temp }}/cng-csr/lanveriq-cng-synthetic.csr.pem
        run: ./gradlew test --tests com.lanveriq.server.enrollment.WindowsCngCsrInteropTest --no-daemon


  rustls-cng-nonexportable-signing-probe:
    # Separate disposable Windows user/session. No actual service, private
    # machine CNG key, network listener, client certificate installation or
    # remote session. Only rustls' SigningKey contract is exercised.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.94 stable toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Reopen a non-exportable CNG key from Rust and sign via rustls-cng
        shell: pwsh
        env:
          SYNTHETIC_CSR_PATH: ${{ runner.temp }}\\lanveriq-cng-rustls-probe.csr.pem
        run: |
          ./apps/agent/tools/windows/verify-cng-csr.ps1 -PublicCsrPath $env:SYNTHETIC_CSR_PATH -ProbeRustlsSigning
      - name: Erase disposable public CSR
        if: always()
        shell: pwsh
        env:
          SYNTHETIC_CSR_PATH: ${{ runner.temp }}\\lanveriq-cng-rustls-probe.csr.pem
        run: |
          if (Test-Path -LiteralPath $env:SYNTHETIC_CSR_PATH) {
            Remove-Item -LiteralPath $env:SYNTHETIC_CSR_PATH -Force
          }

  rustls-cng-tls13-memory-handshake:
    # Real rustls TLS1.3 cryptographic handshake over memory buffers only;
    # not Caddy, TCP, Agent HTTP, a real device or a production CA.
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.94
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Verify TLS1.3 CNG mutual handshake (memory and real Reqwest HTTPS loopback)
        shell: pwsh
        env:
          SYNTHETIC_FIXTURES_DIR: ${{ runner.temp }}\\lanveriq-cng-tls13-fixtures
        run: |
          ./apps/agent/tools/windows/verify-cng-tls13-memory.ps1 -FixtureDirectory $env:SYNTHETIC_FIXTURES_DIR
      - name: Assert no disposable certificate fixture survives
        if: always()
        shell: pwsh
        env:
          SYNTHETIC_FIXTURES_DIR: ${{ runner.temp }}\\lanveriq-cng-tls13-fixtures
        run: |
          if (Test-Path -LiteralPath $env:SYNTHETIC_FIXTURES_DIR) {
            throw 'Disposable CNG TLS fixture directory was not removed'
          }
