name: NXT-03B one-time React Query lockfile regeneration
on:
  push:
    paths:
      - '.github/workflows/web-next-query-lock-bootstrap.yml'
permissions:
  contents: write
jobs:
  generate-reviewed-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up pinned pnpm and Node for one-time bootstrap
        uses: pnpm/setup@v3
        with:
          version: '12.0.0'
          runtime: node@24
          working-directory: apps/web-next
          install: false
          require-lockfile: true
          cache: false
      - name: Regenerate ONLY the Next.js candidate lockfile with pnpm
        working-directory: apps/web-next
        run: pnpm install --lockfile-only
      - name: Verify genuine frozen installation
        working-directory: apps/web-next
        run: pnpm install --frozen-lockfile
      - name: Verify route deny gates, safe UI unit tests, and candidate production build
        working-directory: apps/web-next
        run: |
          pnpm run verify:routes
          pnpm test
          pnpm typecheck
          pnpm build
          node scripts/verify-built-pages.mjs
      - name: Commit only the generated lockfile after all checks pass (temporary)
        if: github.ref == 'refs/heads/main'
        run: |
          git add -- apps/web-next/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Already up to date'
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'ci(next): pin verified React Query 5.105 dependency in Next pnpm lockfile'
            git push origin HEAD:main
          fi
