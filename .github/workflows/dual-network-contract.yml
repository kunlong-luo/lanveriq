name: Dual-network access contract (synthetic L1)

# Only a disposable localhost-bound Docker RustDesk OSS process in PR CI.
# No credentials, real devices, DNS, VPN, external access or production deployment.
# A successful socket test does NOT prove native RustDesk sessions or WAN access.
on:
  pull_request:
    paths:
      - 'deploy/network/**'
      - 'deploy/rustdesk/**'
      - 'docs/operations/rustdesk-pilot.md'
      - 'docs/architecture/adrs/0010-rustdesk-dual-network-access.md'
      - 'docs/operations/dual-network-acceptance.md'
      - '.github/workflows/dual-network-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/network/**'
      - 'deploy/rustdesk/**'
      - 'docs/operations/rustdesk-pilot.md'
      - 'docs/architecture/adrs/0010-rustdesk-dual-network-access.md'
      - 'docs/operations/dual-network-acceptance.md'
      - '.github/workflows/dual-network-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-network-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-network-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile read-only network probe
        run: python3 -m py_compile deploy/network/verify_dual_access.py deploy/network/test_verify_dual_access.py
      - name: Assert TLS, network routing and anonymous API fail-closed contracts
        run: python3 -m unittest discover -s deploy/network -p 'test_verify_dual_access.py' -v
      - name: Compile and test RustDesk pilot safety contract
        run: |
          python3 -m py_compile deploy/rustdesk/verify_pilot_config.py deploy/rustdesk/test_verify_pilot_config.py deploy/rustdesk/verify_native_server.py deploy/rustdesk/test_verify_native_server.py deploy/rustdesk/verify_client_release.py deploy/rustdesk/test_verify_client_release.py
          python3 -m unittest discover -s deploy/rustdesk -p 'test_verify_*.py' -v
      - name: Verify locked RustDesk 1.5.1 stable client release metadata
        run: python3 deploy/rustdesk/verify_client_release.py
      - name: Execute official RustDesk 1.5.1 Linux binary version smoke (no install)
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/rustdesk-1.5.1-x86_64.deb"
          install -d "$RUNNER_TEMP/rustdesk-client-extract"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 12 --max-time 160 \
            --proto '=https' --tlsv1.2 \
            'https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-x86_64.deb' \
            --output "$asset"
          python3 deploy/rustdesk/verify_client_release.py --asset linux-amd64-deb --file "$asset"
          pkg="$(dpkg-deb -f "$asset" Package)"
          ver="$(dpkg-deb -f "$asset" Version)"
          arch="$(dpkg-deb -f "$asset" Architecture)"
          [[ "$pkg" == "rustdesk" && "$ver" == 1.5.1* && "$arch" == "amd64" ]] ||
            { echo "FAIL: unexpected official RustDesk Debian package metadata"; exit 1; }
          # Extract rather than install: do not start a systemd RustDesk
          # service or touch any registered client profile.
          dpkg-deb -x "$asset" "$RUNNER_TEMP/rustdesk-client-extract"
          binary="$RUNNER_TEMP/rustdesk-client-extract/usr/bin/rustdesk"
          [[ -f "$binary" && -x "$binary" ]] || { echo "FAIL: missing real RustDesk client ELF"; exit 1; }
          set +e
          version="$(timeout 18s "$binary" --version 2>&1)"
          status=$?
          set -e
          if [[ "$status" != 0 || "$version" != *"1.5.1"* ]]; then
            echo "FAIL: RustDesk 1.5.1 executable did not report the expected stable version (status=$status)"
            ldd "$binary" | grep 'not found' || true
            exit 1
          fi
          echo 'PASS: official stable RustDesk Linux client SHA-256, .deb metadata and real ELF --version (no system service installed).' >> "$GITHUB_STEP_SUMMARY"
      - name: Render Docker Compose and enforce approved-only static network config
        env:
          RUSTDESK_PILOT_RELAY_HOST: localhost
          RUSTDESK_PILOT_BIND_IP: 127.0.0.1
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/rustdesk/compose.pilot.yml --profile pilot config --format json |
            python3 deploy/rustdesk/verify_pilot_config.py --bind-ip "$RUSTDESK_PILOT_BIND_IP" --relay-host "$RUSTDESK_PILOT_RELAY_HOST"
      - name: Boot the real pinned RustDesk OSS image on localhost only
        env:
          RUSTDESK_PILOT_RELAY_HOST: localhost
          RUSTDESK_PILOT_BIND_IP: 127.0.0.1
          LANVERIQ_RUSTDESK_CI_BEHAVIOR_TEST: '1'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/rustdesk/compose.pilot.yml --profile pilot)
          cleanup() { "${compose[@]}" down --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "${compose[@]}" up -d --pull always
          # Docker host TCP port forwarding alone does not prove healthy
          # hbbs/hbbr processes or completed delayed key generation.
          ready=0
          for _ in $(seq 1 25); do
            if "${compose[@]}" exec -T rustdesk-pilot sh -ec 'test -s /data/id_ed25519 && test -s /data/id_ed25519.pub' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo 'FAIL: shared RustDesk key pair absent after startup; showing filenames only.'
            "${compose[@]}" ps || true
            "${compose[@]}" exec -T rustdesk-pilot sh -ec 'ls -l /data' || true
            "${compose[@]}" logs --no-color --tail 45 | sed -E 's/(KEY_PRIV|KEY_PUB|PRIVATE_KEY)=([^[:space:]]+)/\1=[REDACTED]/g' || true
            exit 1
          fi
          python3 deploy/rustdesk/smoke_local.py
          python3 deploy/rustdesk/verify_native_server.py
          python3 deploy/rustdesk/smoke_local.py
          [[ "$("${compose[@]}" ps --status running --services)" == "rustdesk-pilot" ]] || { echo 'FAIL: RustDesk container is not running'; exit 1; }
          echo 'PASS: real RustDesk OSS loopback endpoints + native relay-mode console controls + public key persistence across container restart (no keys printed).' >> "$GITHUB_STEP_SUMMARY"
      - name: Scope reminder
        run: |
          echo 'PASS only for verified official RustDesk client CLI, synthetic unit checks, Compose render, actual localhost RustDesk server/control-plane; no two-peer GUI session, LAN/WAN, ICE/UDP/P2P or relay session proven.' >> "$GITHUB_STEP_SUMMARY"
