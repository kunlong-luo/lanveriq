name: Dual-network access contract (synthetic L1)

# No network calls, secrets, credentials, real devices, DNS, VPN or deployment.
# This intentionally does not claim WAN or actual RustDesk acceptance.
on:
  pull_request:
    paths:
      - 'deploy/network/**'
      - 'deploy/rustdesk/**'
      - 'docs/operations/rustdesk-pilot.md'
      - 'docs/architecture/adrs/0010-rustdesk-dual-network-access.md'
      - 'docs/operations/dual-network-acceptance.md'
      - '.github/workflows/dual-network-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/network/**'
      - 'deploy/rustdesk/**'
      - 'docs/operations/rustdesk-pilot.md'
      - 'docs/architecture/adrs/0010-rustdesk-dual-network-access.md'
      - 'docs/operations/dual-network-acceptance.md'
      - '.github/workflows/dual-network-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lanveriq-network-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-network-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile read-only network probe
        run: python3 -m py_compile deploy/network/verify_dual_access.py deploy/network/test_verify_dual_access.py
      - name: Assert TLS, network routing and anonymous API fail-closed contracts
        run: python3 -m unittest discover -s deploy/network -p 'test_verify_dual_access.py' -v
      - name: Compile and test RustDesk pilot safety contract
        run: |
          python3 -m py_compile deploy/rustdesk/verify_pilot_config.py deploy/rustdesk/test_verify_pilot_config.py
          python3 -m unittest discover -s deploy/rustdesk -p 'test_verify_pilot_config.py' -v
      - name: Render Docker Compose and enforce approved-only static network config
        env:
          RUSTDESK_PILOT_RELAY_HOST: localhost
          RUSTDESK_PILOT_BIND_IP: 127.0.0.1
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/rustdesk/compose.pilot.yml --profile pilot config --format json |
            python3 deploy/rustdesk/verify_pilot_config.py --bind-ip "$RUSTDESK_PILOT_BIND_IP" --relay-host "$RUSTDESK_PILOT_RELAY_HOST"
      - name: Scope reminder
        run: |
          echo 'PASS only for synthetic source/unit + Docker Compose render checks; no containers started, no actual LAN/WAN, ICE/UDP/relay or production reachability proven.' >> "$GITHUB_STEP_SUMMARY"
