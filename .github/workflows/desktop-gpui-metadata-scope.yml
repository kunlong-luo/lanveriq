name: GPUI metadata scope reconciliation (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'tools/gpui_metadata_scope.py'
      - 'tools/test_gpui_metadata_scope.py'
      - '.github/workflows/desktop-gpui-metadata-scope.yml'
      - 'apps/desktop/gpui-candidate/Cargo.toml'
      - 'apps/desktop/gpui-candidate/Cargo.lock'
      - 'apps/desktop/gpui-candidate/Cargo.lock.sha256'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test scope comparison
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_gpui_metadata_scope.py -v
      - name: Install pinned Rust and SBOM generator only
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 install --locked --version '=0.5.10' cargo-cyclonedx
          cargo +1.100.0 cyclonedx --version
      - name: Resolve target metadata and original upstream BOM (no GUI build)
        working-directory: apps/desktop/gpui-candidate
        run: |
          git ls-files --error-unmatch Cargo.lock
          sha256sum --check --strict Cargo.lock.sha256
          cargo +1.100.0 metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > scope-target-metadata.json
          cargo +1.100.0 tree --locked --target x86_64-unknown-linux-gnu -e normal,build --prefix none --format '{p}' > scope-linux-tree.txt
          CARGO_NET_OFFLINE=true cargo +1.100.0 cyclonedx --format json --spec-version 1.6 --target x86_64-unknown-linux-gnu --describe crate
          sha256sum --check --strict Cargo.lock.sha256
          git diff --exit-code -- Cargo.lock Cargo.toml
      - name: Compare metadata nondev reachability, Cargo tree and BOM
        run: python3 tools/gpui_metadata_scope.py apps/desktop/gpui-candidate
      - name: Archive scope evidence and original BOM (not raw metadata or binaries)
        uses: actions/upload-artifact@v4
        with:
          name: gpui-metadata-scope
          path: |
            apps/desktop/gpui-candidate/scope-reconciliation.json
            apps/desktop/gpui-candidate/scope-linux-tree.txt
            apps/desktop/gpui-candidate/*.cdx.json
            apps/desktop/gpui-candidate/bom.json
          if-no-files-found: error
          retention-days: 7
