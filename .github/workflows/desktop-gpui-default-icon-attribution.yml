name: GPUI selected icon source attribution (nonrelease)
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src/candidate_assets.rs'
      - 'apps/desktop/src/main.rs'
      - 'apps/desktop/Cargo.lock'
      - 'tools/gpui_selected_icon_review.py'
      - 'tools/test_gpui_selected_icon_review.py'
      - 'tools/gpui_default_icon_source_index.json'
      - 'tools/gpui_default_icon_attribution.py'
      - 'tools/test_gpui_default_icon_attribution.py'
      - '.github/workflows/desktop-gpui-default-icon-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test exact source match and drift refusal
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_gpui_default_icon_attribution.py -v
      - name: Test selected icon source scope
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_gpui_selected_icon_review.py -v
      - name: Fetch locked registry sources without compiling
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cd apps/desktop
          sha256sum --check --strict Cargo.lock.sha256
          cargo +1.100.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          git diff --exit-code -- Cargo.lock Cargo.toml
      - name: Verify current selected icon source and registry material
        run: |
          python3 tools/gpui_selected_icon_review.py "$RUNNER_TEMP/metadata.json" selected-icon-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-selected-icon-attribution-REVIEW-ONLY
          path: selected-icon-review.json
          if-no-files-found: error
          retention-days: 7
