[package]
name = "lanveriq-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Offline-only Lanveriq desktop installer and status preview"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "lanveriq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
