<!-- L2B-25 disposable Ubuntu OCI system bus review fixture.
     Copy ONLY into the ephemeral container overlay. NOT a product service
     policy, not authorization, and absolutely not an installer. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.lanveriq.Agent.ReviewLab"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.lanveriq.Agent.ReviewLab"
           send_interface="org.lanveriq.Agent.ReviewLab"/>
    <allow send_destination="org.lanveriq.Agent.ReviewLab"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
