plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lanveriq'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Maintained PKCS#10 parser and verifier; never parse ASN.1/CSR by hand.
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    // Maintained token-bucket algorithm and bounded, expiring local cache.
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.3.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.2.0'

    runtimeOnly 'org.postgresql:postgresql'

    // Official Boot 4 sliced MVC/MockMvc test support; no application database.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('test') {
    useJUnitPlatform()
    // Preserve Spring test-context root causes in synthetic-only CI logs.
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStackTraces = true
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Explicit opt-in integration suite; Gradle 'test' and 'check' remain
// unit-only. Never substitute an in-memory database for PostgreSQL 18.
testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
                implementation 'org.springframework.boot:spring-boot-starter-test'
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                implementation 'org.testcontainers:testcontainers-junit-jupiter'
                implementation 'org.testcontainers:testcontainers-postgresql'
                runtimeOnly 'org.postgresql:postgresql'
            }
            targets {
                all {
                    testTask.configure {
                        description = 'Opt-in Docker/Testcontainers PostgreSQL 18 integration tests'
                        shouldRunAfter tasks.named('test')
                        useJUnitPlatform()
                    }
                }
            }
        }
    }
}

// Integration suites do not implicitly inherit this project's implementation
// dependencies; reuse the Spring Boot/JPA/Jackson versions already selected.
configurations.named('integrationTestImplementation') {
    extendsFrom configurations.implementation
}
