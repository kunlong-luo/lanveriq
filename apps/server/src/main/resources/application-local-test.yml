# Explicit personal-development profile only; NEVER activate in production.
# Published fixture credentials are intentionally non-secret and disposable.
# The default application.yml and all capability gates stay unchanged.
server:
  address: 127.0.0.1
  port: 18081

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/lanveriq
    username: lanveriq
    password: ${LANVERIQ_DB_PASSWORD:lanveriq}
    hikari:
      password: ${spring.datasource.password}
