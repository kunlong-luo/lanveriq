spring:
  application:
    name: lanveriq-server
  datasource:
    url: ${LANVERIQ_DB_URL:jdbc:postgresql://127.0.0.1:5432/lanveriq}
    username: ${LANVERIQ_DB_USER:lanveriq}
    password: ${LANVERIQ_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true

server:
  address: ${LANVERIQ_HTTP_BIND:127.0.0.1}
  port: ${LANVERIQ_HTTP_PORT:8080}
  shutdown: graceful
  # No implicit trust for request-supplied X-Forwarded-* headers.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 15m
      tracking-modes: cookie
      cookie:
        name: __Host-lanveriq-session
        path: /
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# This HTTP auth slice is NOT deployed until console TLS, Caddy/Host isolation,
# login throttling and manual browser tests have passed. Default is deny-all.
lanveriq:
  # This enables ONLY an internal parser bean, never an Agent route. DO NOT
  # enable before real Caddy mTLS, exclusive upstream and PostgreSQL gates.
  agent:
    ingress:
      assertions-enabled: ${LANVERIQ_AGENT_INGRESS_ASSERTIONS_ENABLED:false}
      expected-host: ${LANVERIQ_AGENT_INGRESS_EXPECTED_HOST:}
  # This internal-only service has no HTTP route. Keep OFF until reviewed
  # admin/Caddy/CSRF, PostgreSQL and organizational acceptance.
  # WEB-01 health-only scoped JPA reads; DEFAULT OFF and NO HTTP endpoint.
  device-directory:
    http-enabled: ${LANVERIQ_DEVICE_DIRECTORY_HTTP_ENABLED:false}
  device-directory:
    enabled: ${LANVERIQ_DEVICE_DIRECTORY_ENABLED:false}
  device-revocation:
    enabled: ${LANVERIQ_DEVICE_REVOCATION_ENABLED:false}
  console:
    auth:
      enabled: ${LANVERIQ_CONSOLE_AUTH_ENABLED:false}
      origin: ${LANVERIQ_CONSOLE_ORIGIN:}
